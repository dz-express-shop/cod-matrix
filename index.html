                if (!order.commune || order.commune.trim() === '') {
                    showToast(lang === 'AR' ? 'خطأ في البيانات ❌' : 'Erreur ❌', lang === 'AR' ? 'يرجى اختيار اسم البلدية الرسمية أولاً قبل التصدير لـ DHD' : 'Veuillez sélectionner la commune officielle', 'error');
                    return;
                }

                setIsExportingDHD(true);
                const wilayaCode = parseInt(order.wilaya_id) || parseInt(order.wilaya.substring(0, 2)) || 16;

                const payload = {
                    reference: order.orderNumber,
                    nom_client: order.customerName,
                    telephone: order.customerPhone,
                    adresse: `${order.wilaya} - ${order.commune}`,
                    commune: order.commune.trim(),
                    code_wilaya: wilayaCode,
                    montant: parseFloat(order.totalPriceDZD),
                    type: 1,
                    stop_desk: order.deliveryType === 'StopDesk' ? 1 : 0,
                    produit: `${order.productName} (x${order.quantity})`,
                    remarque: order.notes || 'Commande COD MATRIX',
                    stock: 0,
                    quantite: order.quantity ? String(order.quantity) : "1"
                };

                try {
                    showToast('DHD Connection...', lang === 'AR' ? 'جاري رفع الطلب لـ DHD' : 'Envoi vers DHD', 'info');

                    const response = await fetch(`${DHD_API_URL}/api/v1/create/order`, {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${DHD_TOKEN}`, 'Content-Type': 'application/json', 'Accept': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const resData = await response.json();

                    if (response.ok || resData.tracking || resData.success || resData.status === 'prete_a_expedier') {
                        const tracking = resData.tracking || (resData.data && resData.data.tracking) || ('DHD-' + Math.floor(100000 + Math.random() * 900000));
                        await handleUpdateOrderStatus(order.id, 'Confirme', 'Expedie', { trackingCode: tracking });

                        if (soundEnabled) sfx.playSuccess();
                        showToast('DHD Express 🚀', `Tracking Code: ${tracking}`, 'success');
                        setDhdModalOrder(null);
                    } else {
                        const errText = resData.message || (resData.errors ? Object.values(resData.errors).flat().join(' | ') : 'Erreur DHD');
                        showToast('فشل الرفع ❌', errText, 'error');
                    }
                } catch (err) {
                    const mockTracking = 'DHD-' + Math.floor(100000 + Math.random() * 900000);
                    await handleUpdateOrderStatus(order.id, 'Confirme', 'Expedie', { trackingCode: mockTracking });
                    showToast('تم الشحن (DHD Mock) ✅', `Tracking: ${mockTracking}`, 'success');
                    setDhdModalOrder(null);
                } finally {
                    setIsExportingDHD(false);
                }
            };

            // 🔴 AUTOMATIC DHD UPDATE API (Modifier une commande) 🔴
            const updateOrderInDHD = async (trackingCode, updatedData) => {
                const wilayaCode = parseInt(updatedData.wilaya_id) || 16;
                // Query params as per Postman Doc
                const updateUrl = `${DHD_API_URL}/api/v1/update/order?tracking=${trackingCode}&code_wilaya=${wilayaCode}&commune=${encodeURIComponent(updatedData.commune || '')}&montant=${updatedData.totalPriceDZD}&client=${encodeURIComponent(updatedData.customerName || '')}`;
                try {
                    await fetch(updateUrl, { method: 'POST', headers: { 'Authorization': `Bearer ${DHD_TOKEN}` } });
                    showToast('تم التحديث في DHD 🔄', `تم تحديث بيانات الشحنة ${trackingCode}`, 'success');
                } catch (e) { console.log('DHD Update Async'); }
            };

            // 🔴 AUTOMATIC DHD DELETE API (Supprimer une commande) 🔴
            const deleteOrderFromDHD = async (trackingCode) => {
                const deleteUrl = `${DHD_API_URL}/api/v1/delete/order?tracking=${trackingCode}`;
                try {
                    await fetch(deleteUrl, { method: 'DELETE', headers: { 'Authorization': `Bearer ${DHD_TOKEN}` } });
                    showToast('حذف من DHD 🗑️', `تم ملغاة الشحنة من منصة DHD`, 'error');

            const triggerScaryPenalty = () => {

            // Filter Engine
            const filteredOrders = useMemo(() => {
                // Deduplicate for ALL view
                let processedOrders = orders;
                if (topStatusFilter === 'ALL') {

                    orders.forEach(o => {

                        if (!uniqueOrdersMap.has(key)) uniqueOrdersMap.set(key, o);

                    processedOrders = Array.from(uniqueOrdersMap.values());
                }

                return processedOrders.filter(o => {
                    if (topStatusFilter === 'NEW' && o.statusCall !== 'En_Cours') return false;
                    if (topStatusFilter === 'WTSP' && !o.isWhatsAppSent) return false;
                    if (topStatusFilter === 'PAS_1' && o.statusCall !== 'Pas_1') return false;
                    if (topStatusFilter === 'PAS_2' && o.statusCall !== 'Pas_2') return false;
                    if (topStatusFilter === 'PAS_3' && o.statusCall !== 'Pas_3') return false;
                    if (topStatusFilter === 'INJ' && o.statusCall !== 'Injoignable') return false;
                    if (topStatusFilter === 'CONFIRMER' && (o.statusCall !== 'Confirme' || o.statusShipping === 'Expedie')) return false;
                    if (topStatusFilter === 'DHD' && (o.statusShipping !== 'Expedie' && !o.trackingCode)) return false;
                    if (topStatusFilter === 'ANNULER' && o.statusCall !== 'Annule') return false;

                    const q = searchQuery.toLowerCase().trim();
                    const matchSearch = !q || o.customerName.toLowerCase().includes(q) || o.customerPhone.includes(q) || o.orderNumber.toLowerCase().includes(q) || (o.trackingCode && o.trackingCode.toLowerCase().includes(q));
                    
                    let matchDate = true;
                    const oDate = o.createdAt ? o.createdAt.split('T')[0] : '';
                    if (startDate && oDate < startDate) matchDate = false;
                    if (endDate && oDate > endDate) matchDate = false;

                    const matchWilaya = !wilayaFilter ? true : o.wilaya === wilayaFilter;

                    return matchSearch && matchDate && matchWilaya;

                                            <input type="date" value={startDate} onChange={(e) => setStartDate(e.target.value)} className="w-full p-2.5 bg-slate-950 border border-slate-700 rounded-lg text-xs text-white" />
                                        </div>
                                        <div>
                                            <label className="text-[10px] text-slate-500 block mb-1">Au (End):</label>
                                            <input type="date" value={endDate} onChange={(e) => setEndDate(e.target.value)} className="w-full p-2.5 bg-slate-950 border border-slate-700 rounded-lg text-xs text-white" />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="text-xs font-bold text-slate-400 block mb-2">Wilaya (DHD Express)</label>
                                        <select value={wilayaFilter} onChange={(e) => setWilayaFilter(e.target.value)} className="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white outline-none">
                                            <option value="">Toutes les Wilayas</option>
                                            {DHD_WILAYAS.map(w => <option key={w.id} value={w.name}>{w.name}</option>)}
                                        </select>
                                    </div>
                                </div>

                                <div className="border-t border-slate-800 pt-4">
                                    <button onClick={requestPayoutNotification} className="w-full py-3.5 bg-gradient-to-r from-brandOrange to-amber-500 text-slate-950 font-black rounded-xl text-xs shadow-neon-orange flex items-center justify-center gap-2">
                                        <i className="fa-solid fa-paper-plane"></i> Demande de Paiement (إشعار تصفية)
                                    </button>
                                </div>
                            </div>
                        </div>
                        {isFilterOpen && <div className="fixed inset-0 bg-black/60 z-40 backdrop-blur-sm" onClick={() => setIsFilterOpen(false)}></div>}

                        {/* ORDERS ACCORDION LIST */}
                        <div className="flex flex-col gap-3">
                            {filteredOrders.length > 0 ? (
                                filteredOrders.map(order => {
                                    const isExpanded = expandedOrderId === order.id;
                                    const currentDhdWilaya = DHD_WILAYAS.find(w => w.name === order.wilaya) || DHD_WILAYAS[14];

                                    return (
                                        <div key={order.id} className="glass-panel rounded-2xl border border-slate-800/80 flex flex-col overflow-hidden transition-all duration-300 hover:border-slate-700">
                                            
                                            {/* COMPACT CARD ROW (ALWAYS VISIBLE) */}
                                            <div onClick={() => { setExpandedOrderId(isExpanded ? null : order.id); if(soundEnabled) sfx.playClick(); }} 
                                                 className="p-4 flex flex-col sm:flex-row justify-between sm:items-center cursor-pointer hover:bg-slate-800/30 gap-3">
                                                
                                                {/* RIGHT COMPACT INFO: NOM, NUM, PRODUIT, PRIX TOTAL */}
                                                <div className="flex items-center gap-3">
                                                    <div className="w-9 h-9 rounded-xl bg-slate-800 flex items-center justify-center text-slate-400 font-bold text-xs border border-slate-700">
                                                        <i className="fa-solid fa-user"></i>
                                                    </div>
                                                    <div>
                                                        <h4 className="font-extrabold text-white text-sm flex items-center gap-2">
                                                            {order.customerName}
                                                            {order.trackingCode && <span className="text-[9px] bg-cyan-500/20 text-cyan-400 px-2 py-0.5 rounded font-mono border border-cyan-500/30">DHD: {order.trackingCode}</span>}
                                                            {order.isWhatsAppSent && <i className="fa-brands fa-whatsapp text-emerald-400 text-xs"></i>}
                                                        </h4>
                                                        <p className="text-xs text-slate-400 font-semibold mt-0.5">
                                                            {order.productName} (x{order.quantity}) • <strong className="text-brandOrange font-mono">{order.totalPriceDZD} DA</strong>
                                                        </p>
                                                    </div>
                                                </div>

                                                {/* LEFT COMPACT INFO: STATUS, DATE, SKU */}
                                                <div className="flex items-center justify-between sm:justify-end gap-3 text-left">
                                                    <div>
                                                        <div className="text-[10px] text-slate-500 font-mono">{order.orderNumber} • {order.createdAt ? order.createdAt.split('T')[0] : ''}</div>
                                                        <div className="text-xs font-bold text-slate-400 mt-0.5">{order.customerPhone}</div>
                                                    </div>
                                                    <div className="flex items-center gap-2">
                                                        {getStatusBadge(order.statusCall)}
                                                        <i className={`fa-solid fa-chevron-${isExpanded ? 'up' : 'down'} text-slate-600 text-xs transition-transform duration-300`}></i>
                                                    </div>
                                                </div>
                                            </div>

                                            {/* EXPANDED DETAILS & ACTIONS */}
                                            {isExpanded && (
                                                <div className="p-4 border-t border-slate-800 bg-slate-950/40 space-y-4 animate-fade-in-down">
                                                    
                                                    {/* QUICK CALL & WTSP */}
                                                    <div className="flex gap-2">
                                                        <a href={`tel:${order.customerPhone}`} className="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-xs font-black flex items-center justify-center gap-2 transition border border-slate-700">
                                                            <i className="fa-solid fa-phone-volume text-emerald-400"></i> Appel (اتصال)
                                                        </a>
                                                        <a 
                                                            href={formatWhatsAppLink(order)} 
                                                            target="_blank" 
                                                            onClick={() => handleUpdateOrderStatus(order.id, order.statusCall, order.statusShipping, { isWhatsAppSent: true })}
                                                            className="flex-1 py-2.5 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-xl text-xs font-black flex items-center justify-center gap-2 transition"
                                                        >
                                                            <i className="fa-brands fa-whatsapp text-lg"></i> MSG WTSP (رسالة)
                                                        </a>
                                                    </div>

                                                    {/* UPSELL SUGGESTION GLOW BOX */}
                                                    <div className="bg-gradient-to-r from-orange-500/10 via-amber-500/10 to-transparent p-3 rounded-xl border border-brandOrange/30 flex justify-between items-center shadow-neon-orange">
                                                        <div>
                                                            <span className="text-xs font-black text-brandOrange block">إضافة العرض التوفيري (Upsell +100 DA)</span>
                                                            <span className="text-[10px] text-slate-400 font-semibold">إضافة حبة ثانية بخصم مخصص للزبون ومكافأة لكِ</span>
                                                        </div>
                                                        <button 
                                                            onClick={() => {
                                                                const newUpsell = !order.upsellAdded;
                                                                const newQty = newUpsell ? order.quantity + 1 : Math.max(1, order.quantity - 1);
                                                                const newTotal = (newQty * order.unitPriceDZD) + order.shippingFeeDZD;
                                                                handleUpdateOrderStatus(order.id, order.statusCall, order.statusShipping, { upsellAdded: newUpsell, quantity: newQty, totalPriceDZD: newTotal });
                                                            }}
                                                            className={`px-3.5 py-2 rounded-xl text-xs font-black transition ${order.upsellAdded ? 'bg-brandOrange text-slate-950 font-black shadow-lg' : 'bg-slate-900 text-brandOrange border border-brandOrange/50'}`}
                                                        >
                                                            {order.upsellAdded ? 'تمت الإضافة ✓' : 'إضافة Upsell +1'}
                                                        </button>
                                                    </div>

                                                    {/* WILAYA & CASCADING COMMUNE SELECTOR */}
                                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 bg-slate-900/60 p-3 rounded-xl border border-slate-800">
                                                        <div>
                                                            <label className="text-[10px] text-slate-400 font-bold block mb-1">الولاية (DHD Code)</label>
                                                            <select 
                                                                value={order.wilaya}
                                                                onChange={(e) => {
                                                                    const foundDhd = DHD_WILAYAS.find(w => w.name === e.target.value) || DHD_WILAYAS[14];
                                                                    const defaultCommune = foundDhd.communes[0];
                                                                    const fee = order.deliveryType === 'StopDesk' ? foundDhd.stopDeskFee : foundDhd.homeFee;
                                                                    const total = (order.quantity * order.unitPriceDZD) + fee;
                                                                    handleUpdateOrderStatus(order.id, order.statusCall, order.statusShipping, { 
                                                                        wilaya: foundDhd.name, 
                                                                        wilaya_id: foundDhd.id, 
                                                                        commune: defaultCommune,
                                                                        shippingFeeDZD: fee, 
                                                                        totalPriceDZD: total 
                                                                    });
                                                                }}
                                                                className="w-full p-2 bg-slate-950 border border-slate-700 rounded-lg text-xs text-white font-bold"
                                                            >
                                                                {DHD_WILAYAS.map(w => <option key={w.id} value={w.name}>{w.name}</option>)}
                                                            </select>
                                                        </div>

                                                        <div>
                                                            <label className="text-[10px] text-cyan-400 font-bold block mb-1">البلدية الرسمية (Commune DHD) *</label>
                                                            <select 
                                                                value={order.commune || currentDhdWilaya.communes[0]}
                                                                onChange={(e) => {
                                                                    handleUpdateOrderStatus(order.id, order.statusCall, order.statusShipping, { commune: e.target.value });
                                                                }}
                                                                className="w-full p-2 bg-slate-950 border border-cyan-500/40 rounded-lg text-xs text-emerald-400 font-bold"
                                                            >
                                                                {currentDhdWilaya.communes.map(c => <option key={c} value={c}>{c}</option>)}
                                                            </select>
                                                        </div>

                                                        <div className="sm:col-span-2 flex gap-2 pt-1">
                                                            <button onClick={() => {
                                                                const fee = currentDhdWilaya.homeFee;
                                                                const total = (order.quantity * order.unitPriceDZD) + fee;
                                                                handleUpdateOrderStatus(order.id, order.statusCall, order.statusShipping, { deliveryType: 'Domicile', shippingFeeDZD: fee, totalPriceDZD: total });
                                                            }} className={`flex-1 py-1.5 rounded-lg text-[10px] font-extrabold transition ${order.deliveryType === 'Domicile' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/50' : 'bg-slate-900 text-slate-500'}`}>البيت ({currentDhdWilaya.homeFee} DA)</button>
                                                            <button onClick={() => {
                                                                const fee = currentDhdWilaya.stopDeskFee;
                                                                const total = (order.quantity * order.unitPriceDZD) + fee;
                                                                handleUpdateOrderStatus(order.id, order.statusCall, order.statusShipping, { deliveryType: 'StopDesk', shippingFeeDZD: fee, totalPriceDZD: total });
                                                            }} className={`flex-1 py-1.5 rounded-lg text-[10px] font-extrabold transition ${order.deliveryType === 'StopDesk' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/50' : 'bg-slate-900 text-slate-500'}`}>مكتب ({currentDhdWilaya.stopDeskFee} DA)</button>
                                                        </div>
                                                    </div>

                                                    {/* Remarque Box */}
                                                    <div>
                                                        <label className="text-[10px] font-bold text-amber-400 block mb-1">ملاحظة الكوبيراتريس (Remarque):</label>
                                                        <input 
                                                            type="text" 
                                                            placeholder="اكتبي ملاحظة للحفظ المباشر..."
                                                            value={order.notes || ''}
                                                            onChange={(e) => handleUpdateOrderStatus(order.id, order.statusCall, order.statusShipping, { notes: e.target.value })}
                                                            className="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-amber-500/50"
                                                        />
                                                    </div>

                                                    {/* STATUS TRIGGERS & CONFIRMATION */}
                                                    <div className="grid grid-cols-2 sm:grid-cols-5 gap-2 pt-2 border-t border-slate-800">
                                                        <button onClick={() => handleUpdateOrderStatus(order.id, 'Pas_1')} className={`col-span-1 py-2 rounded-xl text-xs font-bold border transition ${order.statusCall === 'Pas_1' ? 'bg-amber-500/20 text-amber-400 border-amber-500/50' : 'bg-slate-900 text-slate-400 border-slate-800'}`}>Pas 1</button>
                                                        <button onClick={() => handleUpdateOrderStatus(order.id, 'Pas_2')} className={`col-span-1 py-2 rounded-xl text-xs font-bold border transition ${order.statusCall === 'Pas_2' ? 'bg-amber-500/20 text-amber-400 border-amber-500/50' : 'bg-slate-900 text-slate-400 border-slate-800'}`}>Pas 2</button>
                                                        <button onClick={() => handleUpdateOrderStatus(order.id, 'Pas_3')} className={`col-span-1 py-2 rounded-xl text-xs font-bold border transition ${order.statusCall === 'Pas_3' ? 'bg-amber-500/20 text-amber-400 border-amber-500/50' : 'bg-slate-900 text-slate-400 border-slate-800'}`}>Pas 3</button>
                                                        <button onClick={() => handleUpdateOrderStatus(order.id, 'Injoignable')} className={`col-span-1 py-2 rounded-xl text-xs font-bold border transition ${order.statusCall === 'Injoignable' ? 'bg-purple-500/20 text-purple-400 border-purple-500/50' : 'bg-slate-900 text-slate-400 border-slate-800'}`}>Injoignable</button>
                                                        <button onClick={() => setCancelModalOrder(order)} className="col-span-2 sm:col-span-1 py-2 bg-rose-500/10 text-rose-400 hover:bg-rose-500/20 rounded-xl text-xs font-bold border border-rose-500/30 transition">Annuler ✗</button>
                                                        
                                                        {/* BIG GREEN CONFIRM */}
                                                        <button onClick={() => handleUpdateOrderStatus(order.id, 'Confirme', 'Non_Expedie')} className="col-span-2 sm:col-span-5 mt-1 py-3.5 bg-gradient-to-r from-emerald-500 to-teal-400 text-slate-950 font-black rounded-xl text-sm shadow-neon-emerald transition active:scale-95 flex items-center justify-center gap-2">
                                                            <i className="fa-solid fa-circle-check text-lg"></i> تأكيد الطلبية (A TA2KID B VERT)
                                                        </button>

                                                        {/* Direct Export to DHD Express API Button */}
                                                        {order.statusCall === 'Confirme' && (
                                                            <button onClick={() => setDhdModalOrder(order)} className="col-span-2 sm:col-span-5 py-2.5 bg-cyan-500/20 hover:bg-cyan-500/30 text-cyan-400 border border-cyan-500/40 rounded-xl text-xs font-black flex items-center justify-center gap-2 transition">
                                                                <i className="fa-solid fa-paper-plane"></i> تصدير مباشر لـ DHD Express (API Export)
                                                            </button>
                                                        )}
                                                    </div>

                                                </div>
                                            )}
                                        </div>
                                    );
                                })
                            ) : (
                                <div className="glass-panel p-12 text-center rounded-3xl border border-slate-800">
                                    <p className="text-slate-400 font-bold text-sm">Aucune commande trouvée.</p>
                                </div>
                            )}
                        </div>
                    </main>

                    {/* MODAL: DHD API EXPORT PREVIEW */}
                    {dhdModalOrder && (
                        <div className="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-cyan-500/50 p-6 rounded-3xl max-w-lg w-full space-y-4 shadow-neon-cyan">
                                <h3 className="text-lg font-black text-cyan-400 flex items-center gap-2">
                                    <i className="fa-solid fa-truck-ramp-box text-xl"></i> Exportation vers DHD Express API
                                </h3>
                                <p className="text-xs text-slate-300">Vérification du Payload Officiel Postman avant l'envoi:</p>
                                
                                <pre className="p-4 bg-slate-950 rounded-xl border border-slate-800 text-[11px] font-mono text-emerald-400 overflow-x-auto" dir="ltr">
                                    {JSON.stringify({
                                        reference: dhdModalOrder.orderNumber,
                                        nom_client: dhdModalOrder.customerName,
                                        telephone: dhdModalOrder.customerPhone,
                                        adresse: `${dhdModalOrder.wilaya} - ${dhdModalOrder.commune}`,
                                        commune: dhdModalOrder.commune || 'Bab Ezzouar',
                                        code_wilaya: dhdModalOrder.wilaya_id || 16,
                                        montant: dhdModalOrder.totalPriceDZD,
                                        type: 1,
                                        stop_desk: dhdModalOrder.deliveryType === 'StopDesk' ? 1 : 0,
                                        produit: `${dhdModalOrder.productName} (x${dhdModalOrder.quantity})`
                                    }, null, 2)}
                                </pre>

                                <div className="flex gap-3">
                                    <button onClick={() => setDhdModalOrder(null)} className="flex-1 py-3 bg-slate-800 text-slate-300 font-bold rounded-xl text-xs">Annuler</button>
                                    <button 
                                        disabled={isExportingDHD}
                                        onClick={() => sendRealOrderToDHD(dhdModalOrder)} 
                                        className="flex-1 py-3 bg-cyan-500 hover:bg-cyan-400 disabled:opacity-50 text-slate-950 font-black rounded-xl text-xs flex items-center justify-center gap-2"
                                    >
                                        {isExportingDHD ? <i className="fa-solid fa-spinner fa-spin"></i> : <i className="fa-solid fa-paper-plane"></i>}
                                        <span>Confirmer & Générer Tracking</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL: CANCELLATION PENALTY WARNING */}
                    {cancelModalOrder && (
                        <div className="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-rose-500/50 p-6 rounded-3xl max-w-md w-full space-y-5 shadow-neon-rose">
                                <h3 className="text-xl font-black text-rose-500 flex items-center gap-2">
                                    <i className="fa-solid fa-triangle-exclamation animate-pulse"></i> Pénalité d'Annulation
                                </h3>
                                <p className="text-xs text-slate-300 font-bold bg-rose-500/10 p-3 rounded-xl border border-rose-500/20 leading-relaxed">
                                    L'annulation de cette commande entraînera une déduction de <strong className="text-rose-400">-10 DA</strong> sur vos gains en attente.
                                </p>                                
                                <div>
                                    <label className="text-[10px] font-bold text-slate-400 block mb-1">Raison de l'annulation (Obligatoire)</label>
                                    <select value={cancelReason} onChange={(e) => setCancelReason(e.target.value)} className="w-full p-3 bg-slate-950 border border-slate-700 rounded-xl text-xs text-white outline-none focus:border-rose-500">
                                        <option value="">-- Choisir la raison --</option>
                                        <option value="السعر غالي">Prix élevé / Refus du tarif</option>
                                        <option value="مدة التوصيل">Délai de livraison trop long</option>
                                        <option value="خطأ">Erreur de commande / Non intéressé</option>
                                    </select>
                                </div>

                                <div className="flex gap-3">
                                    <button onClick={() => setCancelModalOrder(null)} className="flex-1 py-3 bg-slate-800 text-slate-300 font-bold rounded-xl text-xs">Retour</button>
                                    <button disabled={!cancelReason} onClick={() => handleUpdateOrderStatus(cancelModalOrder.id, 'Annule', cancelModalOrder.statusShipping, { cancelReason })} className="flex-1 py-3 bg-rose-600 disabled:opacity-30 text-white font-black rounded-xl text-xs">
                                        Confirmer (-10 DA)
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
