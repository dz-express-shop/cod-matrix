        class SoundEngine {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx && typeof window !== 'undefined') {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
            }
            playSuccess() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.08);
                osc.frequency.setValueAtTime(783.99, now + 0.16);
                osc.frequency.setValueAtTime(1046.50, now + 0.24);
                gain.gain.setValueAtTime(0.18, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.5);
            }
            playChaChing() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc1 = this.ctx.createOscillator();
                const osc2 = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc1.type = 'triangle';
                osc2.type = 'sine';
                osc1.frequency.setValueAtTime(987.77, now);
                osc1.frequency.setValueAtTime(1318.51, now + 0.09);
                osc2.frequency.setValueAtTime(1567.98, now + 0.18);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                osc1.connect(gain);
                osc2.connect(gain);
                gain.connect(this.ctx.destination);
                osc1.start(now);
                osc2.start(now + 0.09);
                osc1.stop(now + 0.5);
                osc2.stop(now + 0.5);
            }
            playClick() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(450, now);
                osc.frequency.exponentialRampToValueAtTime(900, now + 0.04);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.04);
            }
            playCancel() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(320, now);
                osc.frequency.exponentialRampToValueAtTime(160, now + 0.2);
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.2);
            }
        }

                e.preventDefault();
                const found = users.find(u => u.username.toLowerCase() === loginInput.username.trim().toLowerCase() && u.password === loginInput.password);

                    setCurrentUser(found);
                    setLoginError('');
                    if (soundEnabled) sfx.playSuccess();
                } else {
                    setLoginError('اسم المستخدم أو كلمة السر غير صحيحة!');
                    if (soundEnabled) sfx.playCancel();
                }
            };

                setCurrentUser(null);
                setLoginInput({ username: '', password: '' });
                if (soundEnabled) sfx.playClick();
            };

            const filteredOrders = useMemo(() => {
                return orders.filter(o => {
                    const q = searchQuery.toLowerCase().trim();
                    const matchSearch = !q || o.customerName.toLowerCase().includes(q) ||
                                        o.customerPhone.includes(q) ||
                                        o.orderNumber.toLowerCase().includes(q) ||
                                        o.productName.toLowerCase().includes(q);

                    let matchDate = true;
                    const orderDateStr = o.createdAtISO.split('T')[0];
                    if (dateFilter === 'Today') matchDate = orderDateStr === TODAY_ISO;
                    else if (dateFilter === 'Yesterday') matchDate = orderDateStr === YESTERDAY_ISO;
                    else if (dateFilter === 'Last7Days') matchDate = orderDateStr >= PAST_WEEK_ISO;

                    const matchStatusCall = statusCallFilter === 'All' ? true : o.statusCall === statusCallFilter;
                    const matchWilaya = wilayaFilter === 'All' ? true : o.wilaya.includes(wilayaFilter);
                    const matchUrgent = urgentOnly ? o.isUrgent : true;

                    return matchSearch && matchDate && matchStatusCall && matchWilaya && matchUrgent;
                }).sort((a, b) => new Date(b.createdAtISO) - new Date(a.createdAtISO));
            }, [orders, searchQuery, dateFilter, statusCallFilter, wilayaFilter, urgentOnly]);

            const handleUpdateOrderStatus = (orderId, newStatusCall, extraData = {}) => {
                const prevOrder = orders.find(o => o.id === orderId);
                const wasAlreadyConfirmed = prevOrder && prevOrder.statusCall === 'Confirme';
                const isConfirmation = newStatusCall === 'Confirme';

                // Bonuses
                const baseBonus = isConfirmation && !wasAlreadyConfirmed ? 100 : 0;
                const upsellBonus = extraData.upsellAdded && !prevOrder?.upsellAdded ? 100 : 0;
                const totalAddedEarnings = baseBonus + upsellBonus;

                if (isConfirmation || upsellBonus > 0) {
                    if (window.confetti) {
                        window.confetti({ particleCount: 110, spread: 80, origin: { y: 0.7 }, colors: ['#00FF9D', '#FFB800', '#00E5FF', '#8B5CF6'] });
                    }
                    if (upsellBonus > 0 && soundEnabled) sfx.playChaChing();
                    else if (soundEnabled) sfx.playSuccess();

                    setRewardToast({
                        text: `+${totalAddedEarnings} DZD 🔥`,
                        sub: upsellBonus > 0 ? 'مكافأة التأكيد + العرض التوفيري (Upsell)!' : 'تم تأكيد الطلب وإضافته للمستحقات!'
                    });
                    setTimeout(() => setRewardToast(null), 3000);

                } else if (newStatusCall === 'Annule') {
                    if (soundEnabled) sfx.playCancel();
                } else {
                    if (soundEnabled) sfx.playClick();
                }

                setOrders(prevOrders => prevOrders.map(o => {
                    if (o.id === orderId) {
                        return {
                            ...o,
                            statusCall: newStatusCall || o.statusCall,
                            wilaya: extraData.wilaya || o.wilaya,
                            commune: extraData.commune || o.commune,

                            totalPriceDZD: extraData.totalPriceDZD || o.totalPriceDZD,
                            quantity: extraData.quantity || o.quantity,

                            cancelReason: extraData.cancelReason || o.cancelReason,
                            upsellAdded: extraData.upsellAdded !== undefined ? extraData.upsellAdded : o.upsellAdded
                        };
                    }
                    return o;
                }));

                if (currentUser && totalAddedEarnings > 0) {
                    setUsers(prevUsers => prevUsers.map(u => {
                        if (u.id === currentUser.id) {
                            const updatedUser = {
                                ...u,
                                pendingBalanceDZD: u.pendingBalanceDZD + totalAddedEarnings,
                                xp: u.xp + 50,
                                confirmedCount: isConfirmation && !wasAlreadyConfirmed ? u.confirmedCount + 1 : u.confirmedCount
                            };
                            setCurrentUser(updatedUser);
                            return updatedUser;
                        }
                        return u;
                    }));
                }

                setCancelModalOrder(null);
                setCancelReason('');

                                        className="w-full p-3 bg-slate-950 hover:bg-slate-800 border border-slate-800 text-left rounded-xl text-xs text-slate-200 transition font-bold"
                                    >
                                        📲 1. رسالة تأكيد الطلب المباشرة
                                    </button>

                                    <button 
                                        onClick={() => {
                                            let phone = whatsappModalOrder.customerPhone.replace(/\s+/g, '');
                                            if (phone.startsWith('0')) phone = '213' + phone.substring(1);
                                            const msg = encodeURIComponent(`سلام عليكم ${whatsappModalOrder.customerName}، حاولنا الاتصال بكم هاتفياً لتأكيد طلبكم (${whatsappModalOrder.productName}) ولم نتلقى إجابة. يرجى الرد لتحديد موعد الشحن.`);
                                            window.open(`https://wa.me/${phone}?text=${msg}`, '_blank');
                                            setWhatsappModalOrder(null);
                                        }}
                                        className="w-full p-3 bg-slate-950 hover:bg-slate-800 border border-slate-800 text-left rounded-xl text-xs text-amber-400 transition font-bold"
                                    >
                                        📞 2. رسالة "حاولنا الاتصال بكم ولم نجد إجابة"
                                    </button>
                                </div>

                                <button onClick={() => setWhatsappModalOrder(null)} className="w-full py-2 bg-slate-800 text-slate-300 font-bold rounded-xl text-xs">إلغاء</button>
                            </div>
                        </div>
                    )}

                    {/* MODAL: CANCELLATION REASON */}
                    {cancelModalOrder && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl max-w-md w-full space-y-4">
                                <h3 className="text-lg font-bold text-rose-400"><i className="fa-solid fa-triangle-exclamation mr-2"></i> تحديد سبب الإلغاء الإجباري</h3>
                                <select 
                                    value={cancelReason}
                                    onChange={(e) => setCancelReason(e.target.value)}
                                    className="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white"
                                >
                                    <option value="">-- اختر سبب الإلغاء --</option>
                                    <option value="السعر غالي">السعر غالي (Prix Élevé)</option>
                                    <option value="مدة التوصيل طويلة">مدة التوصيل طويلة</option>
                                    <option value="غير رأيه / خطأ بالطلب">غير رأيه / خطأ بالطلب</option>
                                </select>
                                <div className="flex gap-3">
                                    <button onClick={() => setCancelModalOrder(null)} className="flex-1 py-2 bg-slate-800 text-slate-300 font-bold rounded-xl text-xs">تراجع</button>
                                    <button 
                                        disabled={!cancelReason}
                                        onClick={() => handleUpdateOrderStatus(cancelModalOrder.id, 'Annule', { cancelReason })}
                                        className="flex-1 py-2 bg-rose-600 disabled:opacity-50 text-white font-bold rounded-xl text-xs"
                                    >إلغاء الطلب</button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
