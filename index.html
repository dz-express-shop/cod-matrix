                await supabase.from('orders').update(newData).eq('id', orderId);

            const displayedOrders = useMemo(() => {
                let list = topStatusFilter === 'ALL' ? dedupedOrders : orders;
                return list.filter(o => {
                    if (topStatusFilter === 'NEW' && o.statusCall !== 'En_Cours') return false;
                    if (topStatusFilter === 'WTSP' && !o.isWhatsAppSent) return false;
                    if (topStatusFilter === 'PAS_1' && o.statusCall !== 'Pas_1') return false;
                    if (topStatusFilter === 'PAS_2' && o.statusCall !== 'Pas_2') return false;
                    if (topStatusFilter === 'PAS_3' && o.statusCall !== 'Pas_3') return false;
                    if (topStatusFilter === 'INJ' && o.statusCall !== 'Injoignable') return false;
                    if (topStatusFilter === 'CONFIRM' && (o.statusCall !== 'Confirme' || o.trackingCode)) return false;
                    if (topStatusFilter === 'DHD' && !o.trackingCode) return false;
                    if (topStatusFilter === 'ANNULER' && o.statusCall !== 'Annule') return false;

                    const q = searchQuery.toLowerCase();
                    if (q && !o.customerName.toLowerCase().includes(q) && !o.customerPhone.includes(q) && !(o.trackingCode||'').toLowerCase().includes(q)) return false;
                    if (wilayaFilter && o.wilaya !== wilayaFilter) return false;
                    if (startDate && o.createdAt.split('T')[0] < startDate) return false;
                    if (endDate && o.createdAt.split('T')[0] > endDate) return false;
                    
                    return true;
                }).sort((a,b) => {
                    if (topStatusFilter === 'NEW') {
                        return new Date(b.createdAt) - new Date(a.createdAt); // Newest to oldest
                    }
                    return new Date(b.updatedAt || b.createdAt) - new Date(a.updatedAt || a.createdAt); // Last modified first
                });

            // Login Handlers
            const handleLogin = (e) => {

                { key: 'NEW', label: 'NEW', icon: 'fa-sparkles', count: statusCounts.NEW },
                { key: 'WTSP', label: 'WTSP', icon: 'fa-whatsapp', count: statusCounts.WTSP },

                        {loginError && <div className="p-3 bg-rose-500/10 border border-rose-500/30 rounded-xl text-rose-400 text-xs font-bold text-center mb-4"><i className="fa-solid fa-triangle-exclamation"></i> {loginError}</div>}

                                                    <button onClick={()=>updateOrder(order.id, {statusCall: 'Pas_2'})} className="py-2 bg-slate-800 rounded-lg text-[10px] font-bold text-amber-400 border border-slate-700">PAS 2</button>
                                                    <button onClick={()=>updateOrder(order.id, {statusCall: 'Pas_3'})} className="py-2 bg-slate-800 rounded-lg text-[10px] font-bold text-amber-400 border border-slate-700">PAS 3</button>
                                                    <button onClick={()=>updateOrder(order.id, {statusCall: 'Injoignable'})} className="py-2 bg-slate-800 rounded-lg text-[10px] font-bold text-purple-400 border border-slate-700">INJ (مغلق)</button>
                                                </div>

                                                <div className="flex gap-2">
                                                    <button onClick={() => setCancelModalOrder(order)} className="w-1/3 py-3 bg-rose-500/10 text-rose-400 rounded-xl text-xs font-bold border border-rose-500/30">Annuler (-10 DA)</button>
                                                    <button onClick={() => updateOrder(order.id, {statusCall: 'Confirme'})} className="w-2/3 py-3 bg-gradient-to-r from-emerald-500 to-teal-500 text-slate-900 rounded-xl text-sm font-black shadow-neon-green">CONFIRMER (+100 DA) ✓</button>
                                                </div>

                                                {/* HARD DELETE BUTTON & EXPORT TO DHD */}
                                                <div className="pt-2 border-t border-slate-800/80 flex justify-between items-center">
                                                    <button onClick={() => hardDeleteOrder(order)} className="text-[10px] text-rose-500 hover:text-rose-400 font-bold flex items-center gap-1"><i className="fa-solid fa-trash"></i> Supprimer définitivement de la base</button>
                                                    {order.statusCall === 'Confirme' && !order.trackingCode && (
                                                        <button onClick={() => createDHDOrder(order, (t) => updateOrder(order.id, { trackingCode: t, statusShipping: 'Expedie' }))} className="px-4 py-2 bg-cyan-500/20 text-cyan-400 border border-cyan-500/50 rounded-xl text-xs font-black hover:bg-cyan-500/30 transition shadow-neon-cyan">
                                                            <i className="fa-solid fa-paper-plane"></i> EXPORT TO DHD EXPRESS API
                                                        </button>
                                                    )}
                                                </div>

                                                {order.trackingCode && (
                                                    <div className="p-3 bg-cyan-500/10 border border-cyan-500/30 rounded-xl text-center text-xs font-mono text-cyan-400 font-bold">
                                                        DHD TRACKING: {order.trackingCode}
                                                    </div>
                                                )}

                                            </div>
                                        )}
                                    </div>
                                );
                            }) : (
                                <div className="glass-card p-12 text-center rounded-3xl opacity-60">
                                    <i className="fa-solid fa-box-open text-4xl mb-3 text-slate-500"></i>
                                    <p className="text-xs font-bold text-slate-400">Aucune commande trouvée.</p>
                                </div>
                            )}
                        </div>

                    </main>

                    {/* MODAL: CANCEL WARNING */}
                    {cancelModalOrder && (
                        <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                            <div className="bg-[#121624] border border-rose-500/50 p-6 rounded-3xl max-w-sm w-full shadow-2xl fade-in">
                                <h3 className="text-lg font-black text-rose-500 flex items-center gap-2 mb-3"><i className="fa-solid fa-triangle-exclamation"></i> Pénalité d'Annulation</h3>
                                <p className="text-xs text-slate-300 bg-rose-500/10 p-3 rounded-xl border border-rose-500/20 mb-4">L'annulation entraîne une déduction de <strong className="text-rose-400">-10 DA</strong>. {cancelModalOrder.trackingCode && "La commande sera aussi SUPPRIMÉE de DHD Express."}</p>
                                
                                <select value={cancelReason} onChange={e=>setCancelReason(e.target.value)} className="w-full p-3 bg-black/40 border border-slate-700 rounded-xl text-xs text-white outline-none focus:border-rose-500 mb-4">
                                    <option value="">-- Raison --</option>
                                    <option value="Prix élevé">Prix élevé</option>
                                    <option value="Délai">Délai long</option>
                                    <option value="Faux numéro">Faux numéro / Erreur</option>
                                </select>

                                <div className="flex gap-2">
                                    <button onClick={()=>setCancelModalOrder(null)} className="flex-1 py-3 bg-slate-800 text-white rounded-xl text-xs font-bold">Retour</button>
                                    <button disabled={!cancelReason} onClick={() => updateOrder(cancelModalOrder.id, {statusCall: 'Annule', cancelReason: cancelReason})} className="flex-1 py-3 bg-rose-600 disabled:opacity-50 text-white rounded-xl text-xs font-black">Annuler (-10 DA)</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
