                    if (topStatusFilter === 'PAS_2' && o.statusCall !== 'Pas_2') return false;
                    if (topStatusFilter === 'PAS_3' && o.statusCall !== 'Pas_3') return false;
                    if (topStatusFilter === 'INJ' && o.statusCall !== 'Injoignable') return false;
                    if (topStatusFilter === 'CONFIRMER' && (o.statusCall !== 'Confirme' || o.statusShipping === 'Expedie')) return false;
                    if (topStatusFilter === 'DHD' && (o.statusShipping !== 'Expedie' && !o.trackingCode)) return false;
                    if (topStatusFilter === 'WTSP' && !o.isWhatsAppSent) return false;
                    if (topStatusFilter === 'ANNULER' && o.statusCall !== 'Annule') return false;

                    const q = searchQuery.toLowerCase().trim();
                    const matchSearch = !q || o.customerName.toLowerCase().includes(q) || o.customerPhone.includes(q) || o.orderNumber.toLowerCase().includes(q);
                    
                    let matchDate = true;
                    const oDate = o.createdAt ? o.createdAt.split('T')[0] : '';

                    if (endDate && oDate > endDate) matchDate = false;

                                                                {DHD_WILAYAS.map(w => <option key={w.id} value={w.name}>{w.name}</option>)}
                                                            </select>

                                                            {/* Commune Cascading Picker */}
                                                            <div>
                                                                <label className="text-[10px] text-cyan-400 block font-bold mt-1">البلدية الرسمية (Commune) *</label>
                                                                <select 
                                                                    value={order.commune || currentDhdWilaya.communes[0]}
                                                                    onChange={(e) => {
                                                                        handleUpdateOrderStatus(order.id, order.statusCall, order.statusShipping, { commune: e.target.value });
                                                                    }}
                                                                    className="w-full p-2 bg-slate-900 border border-cyan-500/40 rounded-lg text-xs text-emerald-400 font-bold"
                                                                >
                                                                    {currentDhdWilaya.communes.map(c => <option key={c} value={c}>{c}</option>)}
                                                                </select>
                                                            </div>

                                                            <div className="flex gap-1 mt-1">
                                                                <button onClick={() => {
                                                                    const fee = currentDhdWilaya.homeFee;
                                                                    const total = (order.quantity * order.unitPriceDZD) + fee;
                                                                    handleUpdateOrderStatus(order.id, order.statusCall, order.statusShipping, { deliveryType: 'Domicile', shippingFeeDZD: fee, totalPriceDZD: total });
                                                                }} className={`flex-1 py-1.5 rounded text-[10px] font-bold ${order.deliveryType === 'Domicile' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/50' : 'bg-slate-900 text-slate-500'}`}>البيت ({currentDhdWilaya.homeFee} DA)</button>
                                                                <button onClick={() => {
                                                                    const fee = currentDhdWilaya.stopDeskFee;
                                                                    const total = (order.quantity * order.unitPriceDZD) + fee;
                                                                    handleUpdateOrderStatus(order.id, order.statusCall, order.statusShipping, { deliveryType: 'StopDesk', shippingFeeDZD: fee, totalPriceDZD: total });
                                                                }} className={`flex-1 py-1.5 rounded text-[10px] font-bold ${order.deliveryType === 'StopDesk' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/50' : 'bg-slate-900 text-slate-500'}`}>مكتب ({currentDhdWilaya.stopDeskFee} DA)</button>
                                                            </div>
                                                        </div>
                                                    </div>

                                                    {/* Remarque Box */}
                                                    <div>
                                                        <label className="text-[10px] font-bold text-amber-400 block mb-1.5">ملاحظة الكوبيراتريس (Remarque):</label>
                                                        <input 
                                                            type="text" 
                                                            placeholder="اكتبي ملاحظة للحفظ المباشر..."
                                                            value={order.notes || ''}
                                                            onChange={(e) => handleUpdateOrderStatus(order.id, order.statusCall, order.statusShipping, { notes: e.target.value })}
                                                            className="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-amber-500/50"
                                                        />
                                                    </div>

                                                    {/* STATUS TRIGGERS & CONFIRMATION */}
                                                    <div className="grid grid-cols-2 md:grid-cols-5 gap-2 pt-2 border-t border-slate-800">
                                                        <button onClick={() => handleUpdateOrderStatus(order.id, 'Pas_1')} className={`col-span-1 py-2 rounded-xl text-xs font-bold border transition ${order.statusCall === 'Pas_1' ? 'bg-amber-500/20 text-amber-400 border-amber-500/50' : 'bg-slate-900 text-slate-400 border-slate-800'}`}>Pas 1</button>
                                                        <button onClick={() => handleUpdateOrderStatus(order.id, 'Pas_2')} className={`col-span-1 py-2 rounded-xl text-xs font-bold border transition ${order.statusCall === 'Pas_2' ? 'bg-amber-500/20 text-amber-400 border-amber-500/50' : 'bg-slate-900 text-slate-400 border-slate-800'}`}>Pas 2</button>
                                                        <button onClick={() => handleUpdateOrderStatus(order.id, 'Pas_3')} className={`col-span-1 py-2 rounded-xl text-xs font-bold border transition ${order.statusCall === 'Pas_3' ? 'bg-amber-500/20 text-amber-400 border-amber-500/50' : 'bg-slate-900 text-slate-400 border-slate-800'}`}>Pas 3</button>
                                                        <button onClick={() => handleUpdateOrderStatus(order.id, 'Injoignable')} className={`col-span-1 py-2 rounded-xl text-xs font-bold border transition ${order.statusCall === 'Injoignable' ? 'bg-purple-500/20 text-purple-400 border-purple-500/50' : 'bg-slate-900 text-slate-400 border-slate-800'}`}>Injoignable</button>
                                                        <button onClick={() => setCancelModalOrder(order)} className="col-span-2 md:col-span-1 py-2 bg-rose-500/10 text-rose-400 hover:bg-rose-500/20 rounded-xl text-xs font-bold border border-rose-500/30 transition">Annuler ✗</button>
                                                        
                                                        {/* BIG GREEN CONFIRM */}
                                                        <button onClick={() => handleUpdateOrderStatus(order.id, 'Confirme', 'Non_Expedie')} className="col-span-2 md:col-span-5 mt-2 py-4 bg-gradient-to-r from-emerald-500 to-teal-400 text-slate-950 font-black rounded-xl text-sm shadow-neon-emerald transition active:scale-95 flex items-center justify-center gap-2">
                                                            <i className="fa-solid fa-circle-check text-lg"></i> تأكيد الطلبية (A TA2KID B VERT)
                                                        </button>

                                                        {/* Direct Export to DHD Express API Button */}
                                                        {order.statusCall === 'Confirme' && (
                                                            <button onClick={() => setDhdModalOrder(order)} className="col-span-2 md:col-span-5 py-2.5 bg-cyan-500/20 hover:bg-cyan-500/30 text-cyan-400 border border-cyan-500/40 rounded-xl text-xs font-black flex items-center justify-center gap-2 transition">
                                                                <i className="fa-solid fa-paper-plane"></i> تصدير مباشر لـ DHD Express (POST /api/v1/create/order)
                                                            </button>
                                                        )}
                                                    </div>

                                                </div>
                                            )}
                                        </div>
                                    );
                                })
                            ) : (
                                <div className="glass-panel p-12 text-center rounded-3xl border border-slate-800">
                                    <p className="text-slate-400 font-bold text-sm">لا توجد طلبات تطابق الفلتر المالي الحالي.</p>
                                </div>
                            )}
                        </div>
                    </main>

                    {/* MODAL: DHD API EXPORT PREVIEW */}
                    {dhdModalOrder && (
                        <div className="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-cyan-500/50 p-6 rounded-3xl max-w-lg w-full space-y-4 shadow-neon-cyan">
                                <h3 className="text-lg font-black text-cyan-400 flex items-center gap-2">
                                    <i className="fa-solid fa-truck-ramp-box text-xl"></i> تصدير الطلب إلى DHD Express API
                                </h3>
                                <p className="text-xs text-slate-300">سيتم إرسال البيانات الرسمية بما في ذلك البلدية المحددة (`commune`):</p>
                                
                                <pre className="p-4 bg-slate-950 rounded-xl border border-slate-800 text-[11px] font-mono text-emerald-400 overflow-x-auto" dir="ltr">
                                    {JSON.stringify({
                                        reference: dhdModalOrder.orderNumber,
                                        nom_client: dhdModalOrder.customerName,
                                        telephone: dhdModalOrder.customerPhone,
                                        adresse: `${dhdModalOrder.wilaya} - ${dhdModalOrder.commune}`,
                                        commune: dhdModalOrder.commune || 'Bab Ezzouar',
                                        code_wilaya: dhdModalOrder.wilaya_id || 16,
                                        montant: dhdModalOrder.totalPriceDZD,
                                        type: 1,
                                        stop_desk: dhdModalOrder.deliveryType === 'StopDesk' ? 1 : 0,
                                        produit: `${dhdModalOrder.productName} (x${dhdModalOrder.quantity})`
                                    }, null, 2)}
                                </pre>

                                <div className="flex gap-3">
                                    <button onClick={() => setDhdModalOrder(null)} className="flex-1 py-3 bg-slate-800 text-slate-300 font-bold rounded-xl text-xs">إلغاء</button>
                                    <button 
                                        disabled={isExportingDHD}
                                        onClick={() => sendRealOrderToDHD(dhdModalOrder)} 
                                        className="flex-1 py-3 bg-cyan-500 hover:bg-cyan-400 disabled:opacity-50 text-slate-950 font-black rounded-xl text-xs flex items-center justify-center gap-2"
                                    >
                                        {isExportingDHD ? <i className="fa-solid fa-spinner fa-spin"></i> : <i className="fa-solid fa-paper-plane"></i>}
                                        <span>إرسال وتوليد كود التتبع DHD</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL: CANCELLATION PENALTY WARNING */}
                    {cancelModalOrder && (
                        <div className="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-rose-500/50 p-6 rounded-3xl max-w-md w-full space-y-5 shadow-neon-rose">
                                <h3 className="text-xl font-black text-rose-500 flex items-center gap-2">
                                    <i className="fa-solid fa-triangle-exclamation animate-pulse"></i> تحذير: غرامة إلغاء الطلب
                                </h3>
                                <p className="text-xs text-slate-300 font-bold bg-rose-500/10 p-3 rounded-xl border border-rose-500/20 leading-relaxed">
                                    هل أنت متأكدة؟ إلغاء هذا الطلب سيؤدي إلى خصم <strong className="text-rose-400">-10 DA</strong> من مستحقاتك المعلقة كعقوبة.
                                </p>                                
                                <div>
                                    <label className="text-[10px] font-bold text-slate-400 block mb-1">سبب الإلغاء (إجباري)</label>
                                    <select value={cancelReason} onChange={(e) => setCancelReason(e.target.value)} className="w-full p-3 bg-slate-950 border border-slate-700 rounded-xl text-xs text-white outline-none focus:border-rose-500">
                                        <option value="">-- اختاري السبب --</option>
                                        <option value="السعر غالي">السعر غالي / لم يناسبه</option>
                                        <option value="مدة التوصيل">المدة طويلة جداً</option>
                                        <option value="خطأ">خطأ في الطلب / غير مهتم</option>
                                    </select>
                                </div>

                                <div className="flex gap-3">
                                    <button onClick={() => setCancelModalOrder(null)} className="flex-1 py-3 bg-slate-800 text-slate-300 font-bold rounded-xl text-xs">تراجع</button>
                                    <button disabled={!cancelReason} onClick={() => handleUpdateOrderStatus(cancelModalOrder.id, 'Annule', cancelModalOrder.statusShipping, { cancelReason })} className="flex-1 py-3 bg-rose-600 disabled:opacity-30 text-white font-black rounded-xl text-xs">
                                        تأكيد الإلغاء (-10 DA)
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
