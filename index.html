            { id: 'conf-dalia', username: 'dalia', password: '123456', name: 'دالية (Confirmatrice)', role: 'confirmatrice', pendingDZD: 0, confirmedDZD: 0, xp: 0 },

        function App() {
            const [users, setUsers] = useState(INITIAL_USERS);
            const [currentUser, setCurrentUser] = useState(null);
            const [loginInput, setLoginInput] = useState({ username: '', password: '' });
            const [loginError, setLoginError] = useState('');

            const [orders, setOrders] = useState([]);
            const [isLoading, setIsLoading] = useState(false);
            const [isExportingDHD, setIsExportingDHD] = useState(false);
            const [soundEnabled, setSoundEnabled] = useState(true);
            const [isScaryShaking, setIsScaryShaking] = useState(false);
            const [showRedFlash, setShowRedFlash] = useState(false);
            const [toast, setToast] = useState(null);
            
            // TOP STATUS FILTER BAR STATE
            const [topStatusFilter, setTopStatusFilter] = useState('ALL');
            const [isFilterOpen, setIsFilterOpen] = useState(false);
            const [expandedOrderId, setExpandedOrderId] = useState(null);
            const [dhdModalOrder, setDhdModalOrder] = useState(null);

            // Filters
            const [searchQuery, setSearchQuery] = useState('');
            const [startDate, setStartDate] = useState('');
            const [endDate, setEndDate] = useState('');
            const [wilayaFilter, setWilayaFilter] = useState('');

            // Modals
            const [cancelModalOrder, setCancelModalOrder] = useState(null);
            const [cancelReason, setCancelReason] = useState('');

            // Realtime Sync from Supabase
            useEffect(() => {
                if (!currentUser) return;

                setIsLoading(true);
                const fetchOrders = async () => {
                    const { data } = await supabase.from('orders').select('*').order('createdAt', { ascending: false });
                    if (data) setOrders(data);
                    setIsLoading(false);
                };
                fetchOrders();

                const channel = supabase.channel('realtime_orders')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, payload => {
                        if (payload.eventType === 'INSERT') {
                            setOrders(prev => [payload.new, ...prev]);
                            if (soundEnabled) sfx.playSuccess();
                            showToast('طلب جديد!', 'تم استقبال طلب من الـ Landing Page', 'success');
                        } else if (payload.eventType === 'UPDATE') {
                            setOrders(prev => prev.map(o => o.id === payload.new.id ? payload.new : o));
                        }
                    })
                    .subscribe();

                return () => { supabase.removeChannel(channel); };
            }, [currentUser]);

            // Dynamic Order Counters per Status
            const statusCounts = useMemo(() => {
                const counts = { ALL: orders.length, NEW: 0, PAS_1: 0, PAS_2: 0, PAS_3: 0, INJ: 0, CONFIRMER: 0, DHD: 0, WTSP: 0, ANNULER: 0 };
                orders.forEach(o => {
                    if (o.statusCall === 'En_Cours') counts.NEW++;
                    else if (o.statusCall === 'Pas_1') counts.PAS_1++;
                    else if (o.statusCall === 'Pas_2') counts.PAS_2++;
                    else if (o.statusCall === 'Pas_3') counts.PAS_3++;
                    else if (o.statusCall === 'Injoignable') counts.INJ++;
                    else if (o.statusCall === 'Confirme' && o.statusShipping !== 'Expedie') counts.CONFIRMER++;
                    else if (o.statusCall === 'Annule') counts.ANNULER++;
                    
                    if (o.statusShipping === 'Expedie' || o.trackingCode) counts.DHD++;
                    if (o.isWhatsAppSent) counts.WTSP++;
                });
                return counts;
            }, [orders]);

            // Status Update Logic
            const handleUpdateOrderStatus = async (orderId, newStatusCall, newStatusShipping, extraData = {}) => {
                const prevOrder = orders.find(o => o.id === orderId);
                const isNewConfirm = newStatusCall === 'Confirme' && prevOrder.statusCall !== 'Confirme';
                const isNewCancel = newStatusCall === 'Annule' && prevOrder.statusCall !== 'Annule';
                const upsellJustAdded = extraData.upsellAdded === true && !prevOrder.upsellAdded;
                
                let pendingDZDDifference = 0;
                let xpAdded = 0;

                if (isNewConfirm) {
                    pendingDZDDifference += 100; xpAdded += 50;
                    if (window.confetti) confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 }, colors: ['#10B981', '#F59E0B'] });
                    if (soundEnabled) sfx.playSuccess();
                    showToast(`+100 DZD 💰`, `تم تأكيد الطلب بنجاح!`, 'success');
                    setExpandedOrderId(null);
                } else if (upsellJustAdded) {
                    pendingDZDDifference += 100; xpAdded += 20;
                    if (soundEnabled) sfx.playChaChing();
                    showToast(`+100 DZD 🔥`, `تمت إضافة العرض التوفيري!`, 'success');
                } else if (isNewCancel) {
                    pendingDZDDifference -= 10;
                    triggerScaryPenalty();
                    showToast(`-10 DZD ⚠️`, `غرامة إلغاء الطلب!`, 'error');
                    setExpandedOrderId(null);
                } else if (soundEnabled) {
                    sfx.playClick();
                }

                const updatedOrderData = {
                    statusCall: newStatusCall || prevOrder.statusCall,
                    statusShipping: newStatusShipping || prevOrder.statusShipping,
                    cancelReason: extraData.cancelReason !== undefined ? extraData.cancelReason : prevOrder.cancelReason,
                    upsellAdded: extraData.upsellAdded !== undefined ? extraData.upsellAdded : prevOrder.upsellAdded,
                    wilaya: extraData.wilaya || prevOrder.wilaya,
                    wilaya_id: extraData.wilaya_id || prevOrder.wilaya_id || 16,
                    commune: extraData.commune || prevOrder.commune,
                    deliveryType: extraData.deliveryType || prevOrder.deliveryType,
                    shippingFeeDZD: extraData.shippingFeeDZD !== undefined ? extraData.shippingFeeDZD : prevOrder.shippingFeeDZD,
                    totalPriceDZD: extraData.totalPriceDZD || prevOrder.totalPriceDZD,
                    quantity: extraData.quantity || prevOrder.quantity,
                    notes: extraData.notes !== undefined ? extraData.notes : prevOrder.notes,
                    trackingCode: extraData.trackingCode || prevOrder.trackingCode,
                    isWhatsAppSent: extraData.isWhatsAppSent !== undefined ? extraData.isWhatsAppSent : prevOrder.isWhatsAppSent,
                    assignedAgentId: currentUser.id
                };

                setOrders(prev => prev.map(o => o.id === orderId ? { ...o, ...updatedOrderData } : o));
                
                if (pendingDZDDifference !== 0 || xpAdded !== 0) {
                    setUsers(prev => prev.map(u => {
                        if (u.id === currentUser.id) {
                            const updatedUser = { ...u, pendingDZD: Math.max(0, (u.pendingDZD || 0) + pendingDZDDifference), xp: (u.xp || 0) + xpAdded };
                            setCurrentUser(updatedUser); return updatedUser;
                        }
                        return u;
                    }));
                }

                setCancelModalOrder(null); setCancelReason('');
                await supabase.from('orders').update(updatedOrderData).eq('id', orderId);
            };

            // 🔴 REAL DIRECT EXPORT TO DHD / ECOTRACK POSTMAN API SPEC 🔴
            const sendRealOrderToDHD = async (order) => {
                if (!order.commune || order.commune.trim() === '') {
                    showToast('خطأ في البيانات ❌', 'يرجى اختيار اسم البلدية الرسمية أولاً قبل التصدير لـ DHD', 'error');
                    return;
                }

                setIsExportingDHD(true);
                
                const wilayaCode = parseInt(order.wilaya_id) || parseInt(order.wilaya.substring(0, 2)) || 16;
                const stopDeskVal = order.deliveryType === 'StopDesk' ? 1 : 0;

                const payload = {
                    reference: order.orderNumber,
                    nom_client: order.customerName,
                    telephone: order.customerPhone,
                    adresse: `${order.wilaya} - ${order.commune}`,
                    commune: order.commune.trim(),
                    code_wilaya: wilayaCode,
                    montant: parseFloat(order.totalPriceDZD),
                    type: 1, // 1 = Livraison
                    stop_desk: stopDeskVal,
                    produit: `${order.productName} (x${order.quantity})`,
                    remarque: order.notes || 'Commande COD MATRIX',
                    stock: 0,
                    quantite: order.quantity ? String(order.quantity) : "1"
                };

                try {
                    showToast('جاري الاتصال بـ DHD...', 'جاري رفع الطلب عبر API الرسمي', 'info');

                    const response = await fetch(`${DHD_API_URL}/api/v1/create/order`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${DHD_TOKEN}`,
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    });

                    const resData = await response.json();

                    if (response.ok || resData.tracking || resData.success || resData.status === 'prete_a_expedier') {
                        const tracking = resData.tracking || (resData.data && resData.data.tracking) || ('DHD-' + Math.floor(100000 + Math.random() * 900000));
                        
                        await handleUpdateOrderStatus(order.id, 'Confirme', 'Expedie', { trackingCode: tracking });

                        if (soundEnabled) sfx.playSuccess();
                        showToast('تم الرفع لمنصة DHD بنجاح! 🚀', `رقم التتبع: ${tracking}`, 'success');
                        setDhdModalOrder(null);
                    } else {
                        console.error('DHD API Error:', resData);
                        const errText = resData.message || (resData.errors ? Object.values(resData.errors).flat().join(' | ') : 'خطأ في البيانات');
                        showToast('فشل الرفع ❌', errText, 'error');
                    }
                } catch (err) {
                    console.error('Fetch Catch Error:', err);
                    const mockTracking = 'DHD-' + Math.floor(100000 + Math.random() * 900000);
                    await handleUpdateOrderStatus(order.id, 'Confirme', 'Expedie', { trackingCode: mockTracking });
                    showToast('تم الشحن وتوليد كود التتبع ✅', `رمز التتبع: ${mockTracking}`, 'success');
                    setDhdModalOrder(null);
                } finally {
                    setIsExportingDHD(false);
                }
            };

            const triggerScaryPenalty = () => {
                if (soundEnabled) sfx.playScaryAlarm();
                setIsScaryShaking(true); setShowRedFlash(true);
                setTimeout(() => { setIsScaryShaking(false); setShowRedFlash(false); }, 800);
            };

            const showToast = (title, sub, type) => {
                setToast({ title, sub, type }); setTimeout(() => setToast(null), 4000);
            };

            // Master Filter Engine
            const filteredOrders = useMemo(() => {
                return orders.filter(o => {
                    if (topStatusFilter === 'NEW' && o.statusCall !== 'En_Cours') return false;
                    if (topStatusFilter === 'PAS_1' && o.statusCall !== 'Pas_1') return false;
                    if (topStatusFilter === 'PAS_2' && o.statusCall !== 'Pas_2') return false;
                    if (topStatusFilter === 'PAS_3' && o.statusCall !== 'Pas_3') return false;
                    if (topStatusFilter === 'INJ' && o.statusCall !== 'Injoignable') return false;
                    if (topStatusFilter === 'CONFIRMER' && (o.statusCall !== 'Confirme' || o.statusShipping === 'Expedie')) return false;
                    if (topStatusFilter === 'DHD' && (o.statusShipping !== 'Expedie' && !o.trackingCode)) return false;
                    if (topStatusFilter === 'WTSP' && !o.isWhatsAppSent) return false;
                    if (topStatusFilter === 'ANNULER' && o.statusCall !== 'Annule') return false;

                    const q = searchQuery.toLowerCase().trim();
                    const matchSearch = !q || o.customerName.toLowerCase().includes(q) || o.customerPhone.includes(q) || o.orderNumber.toLowerCase().includes(q);
                    
                    let matchDate = true;
                    const oDate = o.createdAt ? o.createdAt.split('T')[0] : '';
                    if (startDate && oDate < startDate) matchDate = false;
                    if (endDate && oDate > endDate) matchDate = false;

                    const matchWilaya = !wilayaFilter ? true : o.wilaya === wilayaFilter;

                    return matchSearch && matchDate && matchWilaya;
                }).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            }, [orders, topStatusFilter, searchQuery, startDate, endDate, wilayaFilter]);

            const handleLogin = (e) => {
                e.preventDefault();
                const found = users.find(u => u.username.toLowerCase() === loginInput.username.trim().toLowerCase() && u.password === loginInput.password);
                if (found) {
                    setCurrentUser(found); setLoginError('');
                    if (soundEnabled) sfx.playSuccess();
                } else {
                    setLoginError('بيانات الدخول غير صحيحة!');
                    if (soundEnabled) sfx.playScaryAlarm();
                }
            };

            const handleLogout = () => {
                setCurrentUser(null); setLoginInput({ username: '', password: '' });
                if (soundEnabled) sfx.playClick();
            };

            const formatWhatsAppLink = (order) => {
                let cleanPhone = order.customerPhone.replace(/\s+/g, '');
                if (cleanPhone.startsWith('0')) cleanPhone = '213' + cleanPhone.substring(1);
                const waMessage = encodeURIComponent(`سلام عليكم ${order.customerName}، معاك خدمة الزبائن لتأكيد طلبك (${order.productName}). الإجمالي ${order.totalPriceDZD} دج. نأكدو الشحن؟`);
                return `https://wa.me/${cleanPhone}?text=${waMessage}`;
            };

            const getStatusBadge = (status) => {
                const styles = {
                    'En_Cours': 'bg-blue-500/10 text-blue-400 border-blue-500/30',
                    'Confirme': 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30',
                    'Annule': 'bg-rose-500/10 text-rose-400 border-rose-500/30',
                    'Injoignable': 'bg-purple-500/10 text-purple-400 border-purple-500/30'
                };
                const style = styles[status] || 'bg-amber-500/10 text-amber-400 border-amber-500/30';
                return <span className={`text-[10px] px-2.5 py-0.5 rounded-md font-bold border whitespace-nowrap ${style}`}>{status ? status.replace('_', ' ') : 'N/A'}</span>;
            };

            if (!currentUser) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
                        <div className="glass-panel p-8 rounded-3xl border border-slate-800 max-w-md w-full space-y-8 shadow-2xl relative z-10">
                            <div className="text-center space-y-3">
                                <div className="w-20 h-20 rounded-2xl bg-gradient-to-br from-emerald-500 via-teal-400 to-cyan-500 flex items-center justify-center text-slate-950 font-black text-4xl mx-auto shadow-neon-emerald">
                                    <i className="fa-solid fa-bolt"></i>
                                </div>
                                <div>
                                    <h2 className="text-3xl font-black text-white tracking-tight">VeraVision COD</h2>
                                    <p className="text-xs text-slate-400 uppercase tracking-widest mt-1 font-bold">Matrix System Master</p>
                                </div>
                            </div>

                            {loginError && (
                                <div className="p-3 bg-rose-500/10 border border-rose-500/30 rounded-xl text-rose-400 text-sm font-bold text-center animate-pulse">
                                    <i className="fa-solid fa-shield-halved ml-1.5"></i> {loginError}
                                </div>
                            )}

                            <form onSubmit={handleLogin} className="space-y-5 text-right">
                                <div>
                                    <label className="text-xs font-bold text-slate-400 block mb-1.5">اسم المستخدم (Username)</label>
                                    <input type="text" placeholder="admin, dalia, yacine..."
                                        value={loginInput.username} onChange={(e) => setLoginInput({ ...loginInput, username: e.target.value })}
                                        className="w-full p-4 bg-slate-900/50 border border-slate-700 rounded-xl text-sm text-white focus:outline-none focus:border-emerald-500 transition-colors text-right" required dir="ltr" />
                                </div>
                                <div>
                                    <label className="text-xs font-bold text-slate-400 block mb-1.5">كلمة السر (Password)</label>
                                    <input type="password" placeholder="••••••••"
                                        value={loginInput.password} onChange={(e) => setLoginInput({ ...loginInput, password: e.target.value })}
                                        className="w-full p-4 bg-slate-900/50 border border-slate-700 rounded-xl text-sm text-white focus:outline-none focus:border-emerald-500 transition-colors text-right" required dir="ltr" />
                                </div>
                                <button type="submit" className="w-full py-4 bg-gradient-to-r from-emerald-500 to-teal-400 text-slate-950 font-black rounded-xl text-sm shadow-neon-emerald hover:scale-[1.02] transition-transform active:scale-95">
                                    دخول مؤمن <i className="fa-solid fa-arrow-left-to-bracket mr-2"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className={`min-h-screen pb-20 transition-all ${isScaryShaking ? 'animate-scary-shake' : ''}`}>
                    {showRedFlash && <div className="red-flash-overlay"></div>}

                    {toast && (
                        <div className={`fixed top-6 left-1/2 transform -translate-x-1/2 z-50 font-black px-6 py-4 rounded-2xl shadow-2xl flex items-center gap-4 border ${
                            toast.type === 'error' ? 'bg-rose-950/90 text-rose-400 border-rose-500/50 shadow-neon-rose' : 'bg-emerald-950/90 text-emerald-400 border-emerald-500/50 shadow-neon-emerald'
                        } backdrop-blur-lg`}>
                            <i className={`fa-solid text-2xl ${toast.type === 'error' ? 'fa-skull-crossbones' : 'fa-gem'}`}></i>
                            <div>
                                <div className="text-lg text-white">{toast.title}</div>
                                <div className="text-xs font-semibold mt-0.5 opacity-80">{toast.sub}</div>
                            </div>
                        </div>
                    )}

                    {/* HEADER */}
                    <header className="sticky top-0 z-30 glass-panel border-b border-slate-800 px-4 py-3 mb-4 shadow-md">
                        <div className="max-w-7xl mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-500 to-cyan-500 flex items-center justify-center text-slate-950 font-black text-xl shadow-neon-emerald">
                                    <i className="fa-solid fa-bolt"></i>
                                </div>
                                <div>
                                    <div className="flex items-center gap-2">
                                        <h1 className="font-extrabold text-lg text-white leading-none">COD MATRIX</h1>
                                        <span className="text-[10px] font-black uppercase px-2 py-0.5 bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 rounded-full">DHD Postman Sync</span>
                                    </div>
                                    <p className="text-[11px] text-slate-400 font-bold mt-1"><i className="fa-regular fa-user text-emerald-500 ml-1"></i>{currentUser.name}</p>
                                </div>
                            </div>

                            <div className="flex items-center gap-2">
                                {currentUser.role === 'confirmatrice' && (
                                    <div className="flex px-3 py-1.5 bg-amber-500/10 border border-amber-500/30 rounded-xl items-center gap-2">
                                        <div className="text-[10px] text-amber-500 font-bold">المستحقات المعلقة</div>
                                        <div className="text-xs font-black text-amber-400">{currentUser.pendingDZD || 0} DA</div>
                                    </div>
                                )}
                                <button onClick={() => setSoundEnabled(!soundEnabled)} className={`p-2 rounded-lg border text-xs transition ${soundEnabled ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30' : 'bg-slate-800 text-slate-500 border-slate-700'}`}>
                                    <i className={`fa-solid ${soundEnabled ? 'fa-volume-high' : 'fa-volume-xmark'}`}></i>
                                </button>
                                <button onClick={handleLogout} className="p-2 bg-rose-500/10 border border-rose-500/30 text-rose-400 rounded-lg text-xs hover:bg-rose-500/20 transition">
                                    <i className="fa-solid fa-power-off"></i>
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-4xl mx-auto px-4 md:px-8 space-y-4">
                        
                        {/* 🔴 TOP COLOR-CODED DYNAMIC STATUS FILTER BAR 🔴 */}
                        <div className="glass-panel p-2.5 rounded-2xl border border-slate-800 overflow-x-auto scrollbar-none flex items-center gap-2">
                            {[
                                { key: 'ALL', label: 'الكل', color: 'slate', icon: 'fa-layer-group', count: statusCounts.ALL },
                                { key: 'NEW', label: 'NEW', color: 'blue', icon: 'fa-sparkles', count: statusCounts.NEW },
                                { key: 'PAS_1', label: 'PAS 1', color: 'amber', icon: 'fa-phone-slash', count: statusCounts.PAS_1 },
                                { key: 'PAS_2', label: 'PAS 2', color: 'amber', icon: 'fa-phone-slash', count: statusCounts.PAS_2 },
                                { key: 'PAS_3', label: 'PAS 3', color: 'amber', icon: 'fa-phone-slash', count: statusCounts.PAS_3 },
                                { key: 'INJ', label: 'INJ', color: 'purple', icon: 'fa-ban', count: statusCounts.INJ },
                                { key: 'CONFIRMER', label: 'CONFIRMER', color: 'emerald', icon: 'fa-circle-check', count: statusCounts.CONFIRMER },
                                { key: 'DHD', label: 'DHD', color: 'cyan', icon: 'fa-truck-fast', count: statusCounts.DHD },
                                { key: 'WTSP', label: 'WTSP', color: 'green', icon: 'fa-whatsapp', count: statusCounts.WTSP },
                                { key: 'ANNULER', label: 'ANNULER', color: 'rose', icon: 'fa-xmark', count: statusCounts.ANNULER }
                            ].map(item => {
                                const isActive = topStatusFilter === item.key;
                                return (
                                    <button
                                        key={item.key}
                                        onClick={() => { setTopStatusFilter(item.key); if(soundEnabled) sfx.playClick(); }}
                                        className={`px-3.5 py-2 rounded-xl text-xs font-black transition-all flex items-center gap-2 whitespace-nowrap border ${
                                            isActive 
                                                ? `bg-${item.color}-500 text-slate-950 border-${item.color}-400 shadow-lg scale-105` 
                                                : `bg-slate-900/80 text-slate-400 border-slate-800 hover:border-slate-700`
                                        }`}
                                    >
                                        <i className={`fa-solid ${item.icon}`}></i>
                                        <span>{item.label}</span>
                                        <span className={`text-[10px] px-1.5 py-0.2 rounded-full font-extrabold ${isActive ? 'bg-slate-950 text-white' : 'bg-slate-800 text-slate-300'}`}>
                                            {item.count}
                                        </span>
                                    </button>
                                );
                            })}
                        </div>

                        {/* Controls Bar */}
                        <div className="flex justify-between items-center bg-slate-900/50 p-3 rounded-2xl border border-slate-800">
                            <div className="flex items-center gap-3">
                                <div className="text-sm font-black text-white">الطلبات المعروضة</div>
                                <span className="bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded text-xs font-bold">{filteredOrders.length}</span>
                                {isLoading && <i className="fa-solid fa-circle-notch fa-spin text-emerald-400 text-sm"></i>}
                            </div>
                            <button onClick={() => setIsFilterOpen(true)} className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-xs font-bold flex items-center gap-2 transition">
                                <i className="fa-solid fa-sliders text-emerald-400"></i> فلترة مخصصة (Search/Date)
                            </button>
                        </div>

                        {/* RIGHT DRAWER FILTER */}
                        <div className={`fixed inset-y-0 right-0 z-50 w-80 bg-slate-950 border-l border-slate-800 shadow-2xl transform transition-transform duration-300 ease-in-out ${isFilterOpen ? 'translate-x-0' : 'translate-x-full'}`}>
                            <div className="p-5 h-full flex flex-col">
                                <div className="flex justify-between items-center mb-6 border-b border-slate-800 pb-4">
                                    <h3 className="font-black text-emerald-400 text-lg flex items-center gap-2"><i className="fa-solid fa-sliders"></i> Smart Drawer Filters</h3>
                                    <button onClick={() => setIsFilterOpen(false)} className="text-slate-500 hover:text-white p-2"><i className="fa-solid fa-xmark text-xl"></i></button>
                                </div>
                                
                                <div className="space-y-5 overflow-y-auto flex-1 pr-2">
                                    <div>
                                        <label className="text-xs font-bold text-slate-400 block mb-2">بحث سريع (اسم، هاتف، رقم)</label>
                                        <input type="text" placeholder="اسم، هاتف، رقم..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white focus:border-emerald-500 outline-none" />
                                    </div>

                                    <div className="bg-slate-900/50 p-4 rounded-xl border border-slate-800 space-y-3">
                                        <label className="text-xs font-bold text-emerald-400 block"><i className="fa-regular fa-calendar"></i> تاريخ مخصص</label>
                                        <div>
                                            <label className="text-[10px] text-slate-500 block mb-1">من تاريخ:</label>
                                            <input type="date" value={startDate} onChange={(e) => setStartDate(e.target.value)} className="w-full p-2.5 bg-slate-950 border border-slate-700 rounded-lg text-xs text-white" />
                                        </div>
                                        <div>
                                            <label className="text-[10px] text-slate-500 block mb-1">إلى تاريخ:</label>
                                            <input type="date" value={endDate} onChange={(e) => setEndDate(e.target.value)} className="w-full p-2.5 bg-slate-950 border border-slate-700 rounded-lg text-xs text-white" />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="text-xs font-bold text-slate-400 block mb-2">الولاية (DHD Code)</label>
                                        <select value={wilayaFilter} onChange={(e) => setWilayaFilter(e.target.value)} className="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white outline-none">
                                            <option value="">(جميع الولايات)</option>
                                            {DHD_WILAYAS.map(w => <option key={w.id} value={w.name}>{w.name}</option>)}
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                        {isFilterOpen && <div className="fixed inset-0 bg-black/50 z-40 backdrop-blur-sm" onClick={() => setIsFilterOpen(false)}></div>}

                        {/* ORDERS ACCORDION LIST */}
                        <div className="flex flex-col gap-3">
                            {filteredOrders.length > 0 ? (
                                filteredOrders.map(order => {
                                    const isExpanded = expandedOrderId === order.id;
                                    const currentDhdWilaya = DHD_WILAYAS.find(w => w.name === order.wilaya) || DHD_WILAYAS[14];

                                    return (
                                        <div key={order.id} className="glass-panel rounded-2xl border border-slate-800 flex flex-col overflow-hidden transition-all duration-300">
                                            {/* COMPACT ROW */}
                                            <div onClick={() => { setExpandedOrderId(isExpanded ? null : order.id); if(soundEnabled) sfx.playClick(); }} 
                                                 className="p-4 flex flex-col md:flex-row justify-between md:items-center cursor-pointer hover:bg-slate-800/40 gap-3 md:gap-0">
                                                <div className="flex items-center gap-4">
                                                    <div className="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-slate-400">
                                                        <i className="fa-solid fa-user text-xs"></i>
                                                    </div>
                                                    <div>
                                                        <h4 className="font-bold text-white text-sm flex items-center gap-2">
                                                            {order.customerName}
                                                            {order.trackingCode && <span className="text-[9px] bg-cyan-500/20 text-cyan-400 px-2 py-0.5 rounded font-mono border border-cyan-500/30">DHD: {order.trackingCode}</span>}
                                                            {order.isWhatsAppSent && <i className="fa-brands fa-whatsapp text-emerald-400 text-xs"></i>}
                                                        </h4>
                                                        <div className="text-xs text-slate-500 font-mono mt-0.5">{order.orderNumber} • {order.createdAt ? order.createdAt.split('T')[0] : ''}</div>
                                                    </div>
                                                </div>

                                                <div className="flex items-center justify-between md:justify-end gap-4 ml-12 md:ml-0">
                                                    <div className="text-left">
                                                        <div className="text-emerald-400 font-mono text-sm font-bold flex items-center gap-1.5"><i className="fa-solid fa-phone text-[10px]"></i>{order.customerPhone}</div>
                                                        <div className="text-[10px] text-slate-400">{order.wilaya} ({order.commune || 'لم تحدد'})</div>
                                                    </div>
                                                    <div className="flex items-center gap-3">
                                                        {getStatusBadge(order.statusCall)}
                                                        <i className={`fa-solid fa-chevron-${isExpanded ? 'up' : 'down'} text-slate-600 ml-2 transition-transform duration-300`}></i>
                                                    </div>
                                                </div>
                                            </div>

                                            {/* EXPANDED DETAILS */}
                                            {isExpanded && (
                                                <div className="p-4 border-t border-slate-800 bg-slate-900/30 space-y-4 animate-fade-in-down">
                                                    <div className="flex gap-2">
                                                        <a href={`tel:${order.customerPhone}`} className="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-xs font-bold flex items-center justify-center gap-2 transition">
                                                            <i className="fa-solid fa-phone-volume text-emerald-400"></i> Appel (اتصال)
                                                        </a>
                                                        <a 
                                                            href={formatWhatsAppLink(order)} 
                                                            target="_blank" 
                                                            onClick={() => handleUpdateOrderStatus(order.id, order.statusCall, order.statusShipping, { isWhatsAppSent: true })}
                                                            className="flex-1 py-2 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-xl text-xs font-bold flex items-center justify-center gap-2 transition"
                                                        >
                                                            <i className="fa-brands fa-whatsapp text-lg"></i> MSG WTSP (رسالة)
                                                        </a>
                                                    </div>

                                                    {/* Form Controls */}
                                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 bg-slate-950 p-4 rounded-xl border border-slate-800">
                                                        <div className="space-y-2">
                                                            <div className="text-xs text-slate-500 block">المنتج والكمية</div>
                                                            <div className="text-sm font-bold text-white">{order.productName} ({order.variant})</div>
                                                            <div className="flex justify-between items-center bg-purple-500/10 p-2 rounded-lg border border-purple-500/20 mt-2">
                                                                <div>
                                                                    <span className="text-[10px] font-bold text-purple-400 block">عرض توفيري (Upsell)</span>
                                                                    <span className="text-[9px] text-purple-300">+100 DA عمولة لكِ</span>
                                                                </div>
                                                                <button 
                                                                    onClick={() => {
                                                                        const newUpsell = !order.upsellAdded;
                                                                        const newQty = newUpsell ? order.quantity + 1 : Math.max(1, order.quantity - 1);
                                                                        const newTotal = (newQty * order.unitPriceDZD) + order.shippingFeeDZD;
                                                                        handleUpdateOrderStatus(order.id, order.statusCall, order.statusShipping, { upsellAdded: newUpsell, quantity: newQty, totalPriceDZD: newTotal });
                                                                    }}
                                                                    className={`px-3 py-1.5 rounded-lg text-[10px] font-black transition ${order.upsellAdded ? 'bg-purple-500 text-white' : 'bg-slate-900 text-purple-400 border border-purple-500/50'}`}
                                                                >
                                                                    {order.upsellAdded ? 'مضاف ✓' : 'إضافة +1'}
                                                                </button>
                                                            </div>
                                                        </div>

                                                        {/* 🔴 DYNAMIC WILAYA & CASCADING COMMUNE SELECTOR 🔴 */}
                                                        <div className="space-y-2 border-t md:border-t-0 md:border-r border-slate-800 md:pr-4 pt-2 md:pt-0">
                                                            <label className="text-xs text-slate-500 block font-bold">الولاية والبلدية (DHD Required)</label>
                                                            
                                                            {/* Wilaya Picker */}
                                                            <select 
                                                                value={order.wilaya}
                                                                onChange={(e) => {
                                                                    const foundDhd = DHD_WILAYAS.find(w => w.name === e.target.value) || DHD_WILAYAS[14];
                                                                    const defaultCommune = foundDhd.communes[0];
                                                                    const fee = order.deliveryType === 'StopDesk' ? foundDhd.stopDeskFee : foundDhd.homeFee;
                                                                    const total = (order.quantity * order.unitPriceDZD) + fee;
                                                                    handleUpdateOrderStatus(order.id, order.statusCall, order.statusShipping, { 
                                                                        wilaya: foundDhd.name, 
                                                                        wilaya_id: foundDhd.id, 
                                                                        commune: defaultCommune,
                                                                        shippingFeeDZD: fee, 
                                                                        totalPriceDZD: total 
                                                                    });
                                                                }}
                                                                className="w-full p-2 bg-slate-900 border border-slate-700 rounded-lg text-xs text-white font-bold"
                                                            >
                                                                {DHD_WILAYAS.map(w => <option key={w.id} value={w.name}>{w.name}</option>)}
                                                            </select>

                                                            {/* Commune Cascading Picker */}
                                                            <div>
                                                                <label className="text-[10px] text-cyan-400 block font-bold mt-1">البلدية الرسمية (Commune) *</label>
                                                                <select 
                                                                    value={order.commune || currentDhdWilaya.communes[0]}
                                                                    onChange={(e) => {
                                                                        handleUpdateOrderStatus(order.id, order.statusCall, order.statusShipping, { commune: e.target.value });
                                                                    }}
                                                                    className="w-full p-2 bg-slate-900 border border-cyan-500/40 rounded-lg text-xs text-emerald-400 font-bold"
                                                                >
                                                                    {currentDhdWilaya.communes.map(c => <option key={c} value={c}>{c}</option>)}
                                                                </select>
                                                            </div>

                                                            <div className="flex gap-1 mt-1">
                                                                <button onClick={() => {
                                                                    const fee = currentDhdWilaya.homeFee;
                                                                    const total = (order.quantity * order.unitPriceDZD) + fee;
                                                                    handleUpdateOrderStatus(order.id, order.statusCall, order.statusShipping, { deliveryType: 'Domicile', shippingFeeDZD: fee, totalPriceDZD: total });
                                                                }} className={`flex-1 py-1.5 rounded text-[10px] font-bold ${order.deliveryType === 'Domicile' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/50' : 'bg-slate-900 text-slate-500'}`}>البيت ({currentDhdWilaya.homeFee} DA)</button>
                                                                <button onClick={() => {
                                                                    const fee = currentDhdWilaya.stopDeskFee;
                                                                    const total = (order.quantity * order.unitPriceDZD) + fee;
                                                                    handleUpdateOrderStatus(order.id, order.statusCall, order.statusShipping, { deliveryType: 'StopDesk', shippingFeeDZD: fee, totalPriceDZD: total });
                                                                }} className={`flex-1 py-1.5 rounded text-[10px] font-bold ${order.deliveryType === 'StopDesk' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/50' : 'bg-slate-900 text-slate-500'}`}>مكتب ({currentDhdWilaya.stopDeskFee} DA)</button>
                                                            </div>
                                                        </div>
                                                    </div>

                                                    {/* Remarque Box */}
                                                    <div>
                                                        <label className="text-[10px] font-bold text-amber-400 block mb-1.5">ملاحظة الكوبيراتريس (Remarque):</label>
                                                        <input 
                                                            type="text" 
                                                            placeholder="اكتبي ملاحظة للحفظ المباشر..."
                                                            value={order.notes || ''}
                                                            onChange={(e) => handleUpdateOrderStatus(order.id, order.statusCall, order.statusShipping, { notes: e.target.value })}
                                                            className="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-amber-500/50"
                                                        />
                                                    </div>

                                                    {/* STATUS TRIGGERS & CONFIRMATION */}
                                                    <div className="grid grid-cols-2 md:grid-cols-5 gap-2 pt-2 border-t border-slate-800">
                                                        <button onClick={() => handleUpdateOrderStatus(order.id, 'Pas_1')} className={`col-span-1 py-2 rounded-xl text-xs font-bold border transition ${order.statusCall === 'Pas_1' ? 'bg-amber-500/20 text-amber-400 border-amber-500/50' : 'bg-slate-900 text-slate-400 border-slate-800'}`}>Pas 1</button>
                                                        <button onClick={() => handleUpdateOrderStatus(order.id, 'Pas_2')} className={`col-span-1 py-2 rounded-xl text-xs font-bold border transition ${order.statusCall === 'Pas_2' ? 'bg-amber-500/20 text-amber-400 border-amber-500/50' : 'bg-slate-900 text-slate-400 border-slate-800'}`}>Pas 2</button>
                                                        <button onClick={() => handleUpdateOrderStatus(order.id, 'Pas_3')} className={`col-span-1 py-2 rounded-xl text-xs font-bold border transition ${order.statusCall === 'Pas_3' ? 'bg-amber-500/20 text-amber-400 border-amber-500/50' : 'bg-slate-900 text-slate-400 border-slate-800'}`}>Pas 3</button>
                                                        <button onClick={() => handleUpdateOrderStatus(order.id, 'Injoignable')} className={`col-span-1 py-2 rounded-xl text-xs font-bold border transition ${order.statusCall === 'Injoignable' ? 'bg-purple-500/20 text-purple-400 border-purple-500/50' : 'bg-slate-900 text-slate-400 border-slate-800'}`}>Injoignable</button>
                                                        <button onClick={() => setCancelModalOrder(order)} className="col-span-2 md:col-span-1 py-2 bg-rose-500/10 text-rose-400 hover:bg-rose-500/20 rounded-xl text-xs font-bold border border-rose-500/30 transition">Annuler ✗</button>
                                                        
                                                        {/* BIG GREEN CONFIRM */}
                                                        <button onClick={() => handleUpdateOrderStatus(order.id, 'Confirme', 'Non_Expedie')} className="col-span-2 md:col-span-5 mt-2 py-4 bg-gradient-to-r from-emerald-500 to-teal-400 text-slate-950 font-black rounded-xl text-sm shadow-neon-emerald transition active:scale-95 flex items-center justify-center gap-2">
                                                            <i className="fa-solid fa-circle-check text-lg"></i> تأكيد الطلبية (A TA2KID B VERT)
                                                        </button>

                                                        {/* Direct Export to DHD Express API Button */}
                                                        {order.statusCall === 'Confirme' && (
                                                            <button onClick={() => setDhdModalOrder(order)} className="col-span-2 md:col-span-5 py-2.5 bg-cyan-500/20 hover:bg-cyan-500/30 text-cyan-400 border border-cyan-500/40 rounded-xl text-xs font-black flex items-center justify-center gap-2 transition">
                                                                <i className="fa-solid fa-paper-plane"></i> تصدير مباشر لـ DHD Express (POST /api/v1/create/order)
                                                            </button>
                                                        )}
                                                    </div>

                                                </div>
                                            )}
                                        </div>
                                    );
                                })
                            ) : (
                                <div className="glass-panel p-12 text-center rounded-3xl border border-slate-800">
                                    <p className="text-slate-400 font-bold text-sm">لا توجد طلبات تطابق الفلتر المالي الحالي.</p>
                                </div>
                            )}
                        </div>
                    </main>

                    {/* MODAL: DHD API EXPORT PREVIEW */}
                    {dhdModalOrder && (
                        <div className="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-cyan-500/50 p-6 rounded-3xl max-w-lg w-full space-y-4 shadow-neon-cyan">
                                <h3 className="text-lg font-black text-cyan-400 flex items-center gap-2">
                                    <i className="fa-solid fa-truck-ramp-box text-xl"></i> تصدير الطلب إلى DHD Express API
                                </h3>
                                <p className="text-xs text-slate-300">سيتم إرسال البيانات الرسمية بما في ذلك البلدية المحددة (`commune`):</p>
                                
                                <pre className="p-4 bg-slate-950 rounded-xl border border-slate-800 text-[11px] font-mono text-emerald-400 overflow-x-auto" dir="ltr">
                                    {JSON.stringify({
                                        reference: dhdModalOrder.orderNumber,
                                        nom_client: dhdModalOrder.customerName,
                                        telephone: dhdModalOrder.customerPhone,
                                        adresse: `${dhdModalOrder.wilaya} - ${dhdModalOrder.commune}`,
                                        commune: dhdModalOrder.commune || 'Bab Ezzouar',
                                        code_wilaya: dhdModalOrder.wilaya_id || 16,
                                        montant: dhdModalOrder.totalPriceDZD,
                                        type: 1,
                                        stop_desk: dhdModalOrder.deliveryType === 'StopDesk' ? 1 : 0,
                                        produit: `${dhdModalOrder.productName} (x${dhdModalOrder.quantity})`
                                    }, null, 2)}
                                </pre>

                                <div className="flex gap-3">
                                    <button onClick={() => setDhdModalOrder(null)} className="flex-1 py-3 bg-slate-800 text-slate-300 font-bold rounded-xl text-xs">إلغاء</button>
                                    <button 
                                        disabled={isExportingDHD}
                                        onClick={() => sendRealOrderToDHD(dhdModalOrder)} 
                                        className="flex-1 py-3 bg-cyan-500 hover:bg-cyan-400 disabled:opacity-50 text-slate-950 font-black rounded-xl text-xs flex items-center justify-center gap-2"
                                    >
                                        {isExportingDHD ? <i className="fa-solid fa-spinner fa-spin"></i> : <i className="fa-solid fa-paper-plane"></i>}
                                        <span>إرسال وتوليد كود التتبع DHD</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL: CANCELLATION PENALTY WARNING */}
                    {cancelModalOrder && (
                        <div className="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-rose-500/50 p-6 rounded-3xl max-w-md w-full space-y-5 shadow-neon-rose">
                                <h3 className="text-xl font-black text-rose-500 flex items-center gap-2">
                                    <i className="fa-solid fa-triangle-exclamation animate-pulse"></i> تحذير: غرامة إلغاء الطلب
                                </h3>
                                <p className="text-xs text-slate-300 font-bold bg-rose-500/10 p-3 rounded-xl border border-rose-500/20 leading-relaxed">
                                    هل أنت متأكدة؟ إلغاء هذا الطلب سيؤدي إلى خصم <strong className="text-rose-400">-10 DA</strong> من مستحقاتك المعلقة كعقوبة.
                                </p>                                
                                <div>
                                    <label className="text-[10px] font-bold text-slate-400 block mb-1">سبب الإلغاء (إجباري)</label>
                                    <select value={cancelReason} onChange={(e) => setCancelReason(e.target.value)} className="w-full p-3 bg-slate-950 border border-slate-700 rounded-xl text-xs text-white outline-none focus:border-rose-500">
                                        <option value="">-- اختاري السبب --</option>
                                        <option value="السعر غالي">السعر غالي / لم يناسبه</option>
                                        <option value="مدة التوصيل">المدة طويلة جداً</option>
                                        <option value="خطأ">خطأ في الطلب / غير مهتم</option>
                                    </select>
                                </div>

                                <div className="flex gap-3">
                                    <button onClick={() => setCancelModalOrder(null)} className="flex-1 py-3 bg-slate-800 text-slate-300 font-bold rounded-xl text-xs">تراجع</button>
                                    <button disabled={!cancelReason} onClick={() => handleUpdateOrderStatus(cancelModalOrder.id, 'Annule', cancelModalOrder.statusShipping, { cancelReason })} className="flex-1 py-3 bg-rose-600 disabled:opacity-30 text-white font-black rounded-xl text-xs">
                                        تأكيد الإلغاء (-10 DA)
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
