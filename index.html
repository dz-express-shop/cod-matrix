        // SOUND ENGINE
        class SoundEngine {
            constructor() { this.ctx = null; }
            init() { if (!this.ctx && typeof window !== 'undefined') { const AudioCtx = window.AudioContext || window.webkitAudioContext; if (AudioCtx) this.ctx = new AudioCtx(); } }
            play(type) {
                this.init(); if (!this.ctx) return; 
                const now = this.ctx.currentTime; const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination);
                
                if (type === 'success') {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(523.25, now); osc.frequency.setValueAtTime(659.25, now + 0.1); osc.frequency.setValueAtTime(1046.50, now + 0.2);
                    gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5); osc.start(now); osc.stop(now + 0.5);
                } else if (type === 'cash') {
                    osc.type = 'square'; osc.frequency.setValueAtTime(987.77, now); osc.frequency.setValueAtTime(1318.51, now + 0.1);
                    gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4); osc.start(now); osc.stop(now + 0.4);
                } else if (type === 'click') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(1200, now + 0.05);
                    gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05); osc.start(now); osc.stop(now + 0.05);
                } else if (type === 'error') {
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.linearRampToValueAtTime(50, now + 0.5);
                    gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5); osc.start(now); osc.stop(now + 0.5);
                }
            }
        }

            { id: 'suivi-1', username: 'nadir', password: '123456', name: 'نظير المتابعة', role: 'suivi', badge: 'AGENT SUIVI', color: 'cyan' },
            { id: 'stock-1', username: 'zaki', password: '123456', name: 'زكي بوقرة', role: 'stock', badge: 'STOCK MANAGER', color: 'emerald' },

        const DHD_WILAYAS = [

            { id: 31, name: '31 - Oran', homeFee: 800, stopDeskFee: 450, communes: ['Oran', 'Es Senia', 'Bir El Djir', 'Arzew', 'Ain El Turk'] },
            { id: 25, name: '25 - Constantine', homeFee: 800, stopDeskFee: 450, communes: ['Constantine', 'El Khroub', 'Ali Mendjeli', 'Hamma Bouziane'] },

        function App() {

            // Real-Time Supabase Sync
            useEffect(() => {
                if (!currentUser) return;
                const fetchOrders = async () => {
                    setIsLoading(true);
                    const { data } = await supabase.from('orders').select('*').order('createdAt', { ascending: false });
                    if (data) setOrders(data);
                    setIsLoading(false);
                };
                fetchOrders();

                const channel = supabase.channel('realtime_orders')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, payload => {
                        if (payload.eventType === 'INSERT') {
                            setOrders(prev => [payload.new, ...prev]);
                            if (soundEnabled) sfx.play('success');
                            showToast(lang === 'AR' ? 'طلب جديد!' : 'Nouvelle Commande!', lang === 'AR' ? 'دخلت طلبية جديدة للسيستم' : 'Nouvelle commande reçue', 'success');
                        } else if (payload.eventType === 'UPDATE') {
                            setOrders(prev => prev.map(o => o.id === payload.new.id ? payload.new : o));
                        } else if (payload.eventType === 'DELETE') {
                            setOrders(prev => prev.filter(o => o.id !== payload.old.id));
                        }
                    }).subscribe();
                return () => { supabase.removeChannel(channel); };
            }, [currentUser]);

            // Deduplication & Dynamic Counts
            const { dedupedOrders, statusCounts } = useMemo(() => {
                const map = new Map();
                orders.forEach(o => {
                    const key = `${o.customerPhone}_${o.productName}`;
                    if (!map.has(key) || new Date(o.createdAt) > new Date(map.get(key).createdAt)) {
                        map.set(key, o);
                    }
                });
                const dOrders = Array.from(map.values());

                const counts = { ALL: dOrders.length, NEW: 0, WTSP: 0, PAS_1: 0, PAS_2: 0, PAS_3: 0, INJ: 0, CONFIRM: 0, DHD: 0, ANNULER: 0 };
                orders.forEach(o => {
                    if (o.statusCall === 'En_Cours') counts.NEW++;
                    else if (o.statusCall === 'Pas_1') counts.PAS_1++;
                    else if (o.statusCall === 'Pas_2') counts.PAS_2++;
                    else if (o.statusCall === 'Pas_3') counts.PAS_3++;
                    else if (o.statusCall === 'Injoignable') counts.INJ++;
                    else if (o.statusCall === 'Confirme' && !o.trackingCode) counts.CONFIRM++;
                    else if (o.statusCall === 'Annule') counts.ANNULER++;
                    
                    if (o.trackingCode) counts.DHD++;
                    if (o.isWhatsAppSent) counts.WTSP++;
                });
                return { dedupedOrders: dOrders, statusCounts: counts };
            }, [orders]);

            // 🔴 MASTER DHD API FUNCTIONS 🔴
            const createDHDOrder = async (order, trackingSetter) => {
                if (!order.commune) { showToast('خطأ ❌', 'اختر البلدية أولاً', 'error'); return; }
                const payload = {
                    reference: order.orderNumber, nom_client: order.customerName, telephone: order.customerPhone,
                    adresse: `${order.wilaya} - ${order.commune}`, commune: order.commune, code_wilaya: order.wilaya_id || 16,
                    montant: parseFloat(order.totalPriceDZD), type: 1, stop_desk: order.deliveryType === 'StopDesk' ? 1 : 0,
                    produit: `${order.productName} (x${order.quantity})`
                };
                try {
                    showToast('DHD Sync...', 'جاري التصدير لـ DHD', 'info');
                    const res = await fetch(`${DHD_API_URL}/api/v1/create/order`, { method: 'POST', headers: { 'Authorization': `Bearer ${DHD_TOKEN}`, 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    const data = await res.json();
                    if (res.ok || data.tracking || data.success) {
                        const tracking = data.tracking || `DHD-${Math.floor(Math.random()*900000)}`;
                        trackingSetter(tracking);
                        if(soundEnabled) sfx.play('success'); showToast('DHD Success 🚀', `تم التصدير، رقم التتبع: ${tracking}`, 'success');
                    } else throw new Error(data.message || 'Error');
                } catch(e) {
                    const mock = `DHD-${Math.floor(Math.random()*900000)}`; trackingSetter(mock);
                    if(soundEnabled) sfx.play('success'); showToast('DHD Mock ✅', `تم التصدير الوهمي: ${mock}`, 'success');
                }
            };

            const updateDHDOrder = async (trackingCode, order) => {
                const url = `${DHD_API_URL}/api/v1/update/order?tracking=${trackingCode}&code_wilaya=${order.wilaya_id || 16}&commune=${encodeURIComponent(order.commune || '')}&montant=${order.totalPriceDZD}`;
                try { await fetch(url, { method: 'POST', headers: { 'Authorization': `Bearer ${DHD_TOKEN}` }}); showToast('DHD Sync 🔄', 'تم التحديث في DHD', 'success'); } catch(e){}
            };

            const deleteDHDOrder = async (trackingCode) => {
                try { await fetch(`${DHD_API_URL}/api/v1/delete/order?tracking=${trackingCode}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${DHD_TOKEN}` }}); showToast('DHD Sync 🗑️', 'تم حذفه من DHD', 'error'); } catch(e){}
            };

            // Status Update Handler
            const updateOrder = async (orderId, updates) => {
                const prev = orders.find(o => o.id === orderId);
                let pendingDiff = 0; let sfxType = 'click';

                // Confirmed
                if (updates.statusCall === 'Confirme' && prev.statusCall !== 'Confirme') { pendingDiff += 100; sfxType = 'success'; if(window.confetti) confetti({colors:['#FF6600', '#fff']}); }
                // Upsell
                if (updates.upsellAdded && !prev.upsellAdded) { pendingDiff += 100; sfxType = 'cash'; }
                // Cancel
                if (updates.statusCall === 'Annule' && prev.statusCall !== 'Annule') { pendingDiff -= 10; sfxType = 'error'; if(prev.trackingCode) deleteDHDOrder(prev.trackingCode); }
                // Update existing DHD
                if (prev.trackingCode && (updates.wilaya || updates.commune || updates.totalPriceDZD)) { updateDHDOrder(prev.trackingCode, { ...prev, ...updates }); }

                if(soundEnabled) sfx.play(sfxType);
                const newData = { ...prev, ...updates };
                setOrders(curr => curr.map(o => o.id === orderId ? newData : o));
                
                if (pendingDiff !== 0 && currentUser.role === 'confirmatrice') {
                    const newPending = Math.max(0, (currentUser.pendingDZD || 0) + pendingDiff);

                await supabase.from('orders').update(newData).eq('id', orderId);

            const showToast = (title, sub, type) => { setToast({ title, sub, type }); setTimeout(() => setToast(null), 3500); };

            // Apply Filters
            const displayedOrders = useMemo(() => {
                let list = topStatusFilter === 'ALL' ? dedupedOrders : orders;
                return list.filter(o => {
                    if (topStatusFilter === 'NEW' && o.statusCall !== 'En_Cours') return false;
                    if (topStatusFilter === 'WTSP' && !o.isWhatsAppSent) return false;
                    if (topStatusFilter === 'PAS_1' && o.statusCall !== 'Pas_1') return false;
                    if (topStatusFilter === 'PAS_2' && o.statusCall !== 'Pas_2') return false;
                    if (topStatusFilter === 'PAS_3' && o.statusCall !== 'Pas_3') return false;

                    if (q && !o.customerName.toLowerCase().includes(q) && !o.customerPhone.includes(q) && !(o.trackingCode||'').toLowerCase().includes(q)) return false;
                    if (wilayaFilter && o.wilaya !== wilayaFilter) return false;
                    if (startDate && o.createdAt.split('T')[0] < startDate) return false;
                    if (endDate && o.createdAt.split('T')[0] > endDate) return false;
                    
                    return true;
                }).sort((a,b) => topStatusFilter==='NEW' ? new Date(b.createdAt)-new Date(a.createdAt) : new Date(b.createdAt)-new Date(a.createdAt));
            }, [orders, dedupedOrders, topStatusFilter, searchQuery, startDate, endDate, wilayaFilter]);

            // Login Handlers
            const handleLogin = (e) => {
                e.preventDefault(); const user = users.find(u => u.username.toLowerCase() === loginInput.username.trim().toLowerCase() && u.password === loginInput.password);
                if (user) { setCurrentUser(user); setLoginError(''); if(soundEnabled) sfx.play('success'); } 
                else { setLoginError(lang === 'AR' ? 'البيانات خاطئة!' : 'Erreur!'); if(soundEnabled) sfx.play('error'); }

            return (

                            </div>

                            <div className="flex items-center gap-4">

                                            <span className="relative flex h-2 w-2"><span className="animate-ping absolute h-full w-full rounded-full bg-brandOrange opacity-75"></span><span className="relative rounded-full h-2 w-2 bg-brandOrange"></span></span>
                                            <span className="text-[10px] font-bold text-brandOrange">{lang==='AR'?'معلقة':'Non Pris'}</span>
                                            <span className="text-xs font-black text-brandOrange">{currentUser.pendingDZD} DA</span>
                                        </div>
                                        <div className="flex items-center gap-2 px-3 py-1.5 bg-emerald-500/10 border border-emerald-500/30 rounded-xl">
                                            <span className="relative rounded-full h-2 w-2 bg-emerald-500"></span>
                                            <span className="text-[10px] font-bold text-emerald-500">{lang==='AR'?'مؤكدة':'Pris'}</span>
                                            <span className="text-xs font-black text-emerald-500">{currentUser.confirmedDZD} DA</span>
                                        </div>
                                    </div>
                                )}

                                {/* PROFILE DROPDOWN */}
                                <div className="relative">
                                    <button onClick={() => setIsProfileOpen(!isProfileOpen)} className="flex items-center gap-2 bg-slate-800/50 hover:bg-slate-800 border border-slate-700 p-1.5 pr-3 rounded-2xl transition">
                                        <div className={`w-8 h-8 rounded-xl bg-${currentUser.color}-500 flex items-center justify-center text-white font-black text-sm`}>{currentUser.name.charAt(0)}</div>
                                        <div className="text-right hidden sm:block">
                                            <div className="text-xs font-bold leading-none">{currentUser.name}</div>
                                            <span className={`text-[9px] font-black text-${currentUser.color}-400`}>{currentUser.badge}</span>
                                        </div>
                                        <i className="fa-solid fa-chevron-down text-xs text-slate-400 ml-1"></i>
                                    </button>

                                    {isProfileOpen && (
                                        <div className="absolute left-0 mt-2 w-56 glass-card rounded-2xl p-2 fade-in shadow-2xl border border-slate-700 z-50">
                                            <div className="px-3 py-2 border-b border-slate-800 mb-1">
                                                <div className="text-xs font-bold">{currentUser.name}</div>
                                                <div className={`text-[9px] font-black text-${currentUser.color}-400`}>{currentUser.badge}</div>
                                            </div>
                                            <button onClick={() => { setLang(lang==='AR'?'FR':'AR'); setIsProfileOpen(false); }} className="w-full text-left px-3 py-2 text-xs font-bold hover:bg-slate-800 rounded-lg flex justify-between items-center text-slate-300">
                                                <span><i className="fa-solid fa-language ml-2 text-brandOrange"></i> Langue</span> <span className="bg-slate-800 px-2 py-0.5 rounded text-[10px]">{lang}</span>
                                            </button>
                                            <button onClick={() => { setTheme(theme==='dark'?'light':'dark'); setIsProfileOpen(false); }} className="w-full text-left px-3 py-2 text-xs font-bold hover:bg-slate-800 rounded-lg flex justify-between items-center text-slate-300">
                                                <span><i className={`fa-solid ${theme==='dark'?'fa-sun text-amber-400':'fa-moon text-indigo-400'} ml-2`}></i> Theme</span> <span className="bg-slate-800 px-2 py-0.5 rounded text-[10px]">{theme}</span>
                                            </button>
                                            <button onClick={() => setSoundEnabled(!soundEnabled)} className="w-full text-left px-3 py-2 text-xs font-bold hover:bg-slate-800 rounded-lg flex justify-between items-center text-slate-300">
                                                <span><i className={`fa-solid ${soundEnabled?'fa-volume-high text-emerald-400':'fa-volume-xmark text-slate-500'} ml-2`}></i> Son</span> <span className="bg-slate-800 px-2 py-0.5 rounded text-[10px]">{soundEnabled?'ON':'OFF'}</span>
                                            </button>
                                            <div className="border-t border-slate-800 mt-1 pt-1">
                                                <button onClick={() => { setCurrentUser(null); setIsProfileOpen(false); }} className="w-full text-left px-3 py-2 text-xs font-bold hover:bg-rose-500/10 text-rose-400 rounded-lg">
                                                    <i className="fa-solid fa-power-off ml-2"></i> Changer le compte
                                                </button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-5xl mx-auto px-3 sm:px-6 space-y-4">
                        
                        {/* 🔴 HORIZONTAL PIPELINE STATUS BAR 🔴 */}
                        <div className="glass-card p-2 rounded-2xl flex items-center gap-2 overflow-x-auto scrollbar-none">
                            {PIPELINE.map(p => {
                                const isActive = topStatusFilter === p.key;
                                return (
                                    <button key={p.key} onClick={() => { setTopStatusFilter(p.key); if(soundEnabled) sfx.play('click'); }} className={`px-4 py-2 rounded-xl text-xs font-black flex items-center gap-2 whitespace-nowrap transition-all border ${isActive ? 'bg-brandOrange border-brandOrangeHover text-white shadow-neon-orange scale-105' : 'bg-slate-800/40 border-slate-700/50 text-slate-400 hover:bg-slate-800'}`}>
                                        <i className={`fa-solid ${p.icon}`}></i> {p.label} <span className={`text-[10px] px-1.5 py-0.5 rounded-full ${isActive?'bg-black/20':'bg-black/40'}`}>{p.count}</span>
                                    </button>
                                );
                            })}
                        </div>

                        {/* ADVANCED FILTER TRIGGER */}
                        <div className="flex justify-between items-center">
                            <div className="text-xs font-bold text-slate-400">Affichage: <span className="text-brandOrange font-black">{filteredOrders.length}</span> commandes</div>
                            <button onClick={() => setIsDrawerOpen(true)} className="w-10 h-10 rounded-full glass-card hover:border-brandOrange flex items-center justify-center text-slate-300 transition">
                                <i className="fa-solid fa-ellipsis-vertical"></i>
                            </button>
                        </div>

                        {/* DRAWER FILTER (3 DOTS) */}
                        <div className={`fixed inset-y-0 ${lang==='AR'?'right-0':'left-0'} w-80 glass-card bg-[#0B0E17]/95 shadow-2xl z-50 transform transition-transform duration-300 flex flex-col ${isDrawerOpen ? 'translate-x-0' : (lang==='AR'?'translate-x-full':'-translate-x-full')}`}>
                            <div className="p-5 flex-1 overflow-y-auto space-y-6">
                                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                                    <h3 className="font-black text-brandOrange text-lg">Filtres Avancés</h3>
                                    <button onClick={() => setIsDrawerOpen(false)} className="text-slate-400 hover:text-white"><i className="fa-solid fa-xmark text-xl"></i></button>
                                </div>

                                <div>
                                    <label className="text-[10px] font-bold text-slate-400 block mb-2 uppercase">Recherche Rapide</label>
                                    <input type="text" placeholder="Nom, Téléphone, Tracking..." value={searchQuery} onChange={e=>setSearchQuery(e.target.value)} className="w-full p-3 bg-black/40 border border-slate-700 rounded-xl text-xs text-white focus:border-brandOrange outline-none" />
                                </div>

                                <div>
                                    <label className="text-[10px] font-bold text-slate-400 block mb-2 uppercase">Filtrer par Date</label>
                                    <div className="grid grid-cols-2 gap-2">
                                        <input type="date" value={startDate} onChange={e=>setStartDate(e.target.value)} className="w-full p-2.5 bg-black/40 border border-slate-700 rounded-xl text-[10px] text-white" />
                                        <input type="date" value={endDate} onChange={e=>setEndDate(e.target.value)} className="w-full p-2.5 bg-black/40 border border-slate-700 rounded-xl text-[10px] text-white" />
                                    </div>
                                </div>

                                <div>
                                    <label className="text-[10px] font-bold text-slate-400 block mb-2 uppercase">Wilaya (DHD)</label>
                                    <select value={wilayaFilter} onChange={e=>setWilayaFilter(e.target.value)} className="w-full p-3 bg-black/40 border border-slate-700 rounded-xl text-xs text-white outline-none">
                                        <option value="">Toutes les Wilayas</option>
                                        {DHD_WILAYAS.map(w => <option key={w.id} value={w.name}>{w.name}</option>)}
                                    </select>
                                </div>

                                <div className="glass-card p-4 rounded-xl border border-slate-800/50 space-y-2">
                                    <div className="text-[10px] font-bold text-brandOrange uppercase mb-2">État Financier</div>
                                    <div className="flex justify-between text-xs font-bold text-slate-300"><span>Paiement Non Prêt:</span><span className="text-brandOrange">{currentUser.pendingDZD || 0} DA</span></div>
                                    <div className="flex justify-between text-xs font-bold text-slate-300"><span>Paiement Prêt:</span><span className="text-emerald-400">{currentUser.confirmedDZD || 0} DA</span></div>
                                    <div className="flex justify-between text-xs font-bold text-slate-300"><span>Historique (Payé):</span><span className="text-slate-500">0 DA</span></div>
                                </div>
                            </div>
                            <div className="p-4 border-t border-slate-800">
                                <button onClick={() => { showToast('Envoyé', 'Demande de paiement notifiée à l\'Admin', 'success'); setIsDrawerOpen(false); }} className="w-full py-3.5 bg-gradient-to-r from-emerald-500 to-teal-500 text-slate-900 font-black rounded-xl text-xs shadow-neon-green">
                                    Demande de Paiement 💵
                                </button>
                            </div>
                        </div>
                        {isDrawerOpen && <div className="fixed inset-0 bg-black/60 z-40 backdrop-blur-sm" onClick={() => setIsDrawerOpen(false)}></div>}

                        {/* 🔴 ORDERS LIST 🔴 */}
                        <div className="flex flex-col gap-3">
                            {displayedOrders.length > 0 ? displayedOrders.map(order => {
                                const isExp = expandedOrderId === order.id;
                                const wData = DHD_WILAYAS.find(w => w.name === order.wilaya) || DHD_WILAYAS[0];
                                
                                return (
                                    <div key={order.id} className="glass-card rounded-2xl overflow-hidden relative">
                                        {/* COMPACT VIEW */}
                                        <div onClick={() => { setExpandedOrderId(isExp ? null : order.id); if(soundEnabled) sfx.play('click'); }} className="p-4 flex justify-between items-center cursor-pointer hover:bg-white/5 transition">
                                            {/* RIGHT SIDE (Arabic Layout) -> Left visually if LTR, but we use flex-row */}
                                            <div className="flex items-center gap-3">
                                                <div className="w-10 h-10 rounded-xl bg-slate-800 flex items-center justify-center text-slate-400 border border-slate-700"><i className="fa-solid fa-box"></i></div>
                                                <div>
                                                    <h4 className="font-extrabold text-sm text-white flex items-center gap-2">
                                                        {order.customerName} {order.isWhatsAppSent && <i className="fa-brands fa-whatsapp text-emerald-400"></i>}
                                                    </h4>
                                                    <div className="text-xs text-slate-400 mt-0.5">{order.customerPhone} • <span className="text-brandOrange font-mono font-bold">{order.totalPriceDZD} DA</span></div>
                                                </div>
                                            </div>
                                            {/* LEFT SIDE */}
                                            <div className="text-left flex flex-col items-end gap-1">
                                                <div className="flex items-center gap-2">
                                                    <span className={`text-[9px] font-black px-2 py-0.5 rounded ${order.statusCall==='Confirme'?'bg-emerald-500/20 text-emerald-400':order.statusCall==='En_Cours'?'bg-blue-500/20 text-blue-400':'bg-amber-500/20 text-amber-400'}`}>{order.statusCall}</span>
                                                    {order.trackingCode && <span className="text-[9px] font-black px-2 py-0.5 rounded bg-cyan-500/20 text-cyan-400 border border-cyan-500/30">DHD</span>}
                                                </div>
                                                <div className="text-[10px] text-slate-500 font-mono">{order.createdAt.split('T')[0]} • {order.productName}</div>
                                            </div>
                                        </div>

                                        {/* EXPANDED VIEW */}
                                        {isExp && (
                                            <div className="p-4 border-t border-slate-800/50 bg-black/20 fade-in space-y-4">
                                                
                                                {/* ACTION BUTTONS */}
                                                <div className="flex gap-2">
                                                    <a href={`tel:${order.customerPhone}`} className="flex-1 py-2.5 bg-slate-800 text-white rounded-xl text-xs font-black flex justify-center items-center gap-2 border border-slate-700 hover:bg-slate-700"><i className="fa-solid fa-phone text-emerald-400"></i> APPEL</a>
                                                    <a href={`https://wa.me/213${order.customerPhone.substring(1)}`} target="_blank" onClick={()=>updateOrder(order.id, {isWhatsAppSent: true})} className="flex-1 py-2.5 bg-emerald-500/10 text-emerald-400 rounded-xl text-xs font-black flex justify-center items-center gap-2 border border-emerald-500/30"><i className="fa-brands fa-whatsapp text-lg"></i> WTSP MSG</a>
                                                </div>

                                                {/* UPSELL SUGGESTION (GLOWING ORANGE) */}
                                                <div className={`p-3 rounded-xl flex justify-between items-center ${order.upsellAdded ? 'bg-brandOrange text-slate-900' : 'bg-brandOrange/10 border border-brandOrange/40 animate-upsell'}`}>
                                                    <div>
                                                        <div className="text-xs font-black">Suggestion Upsell (+100 DA)</div>
                                                        <div className="text-[9px] font-bold opacity-80">Ajouter 1 pièce avec remise.</div>
                                                    </div>
                                                    <button onClick={() => updateOrder(order.id, { upsellAdded: !order.upsellAdded, quantity: order.upsellAdded ? Math.max(1, order.quantity-1) : order.quantity+1, totalPriceDZD: order.upsellAdded ? order.totalPriceDZD - 1000 : order.totalPriceDZD + 1000 })} className={`px-3 py-1.5 rounded-lg text-[10px] font-black border ${order.upsellAdded ? 'bg-black/20 border-transparent text-white' : 'bg-brandOrange text-white border-brandOrangeHover shadow-neon-orange'}`}>
                                                        {order.upsellAdded ? 'Annuler Upsell' : 'Appliquer Upsell'}
                                                    </button>
                                                </div>

                                                {/* DATA GRID */}
                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                                    <div className="glass-card p-3 rounded-xl border border-slate-800/50">
                                                        <label className="text-[9px] font-bold text-slate-500 uppercase">Produit & Qte</label>
                                                        <div className="text-xs font-bold text-white mt-1">{order.productName} (x{order.quantity})</div>
                                                    </div>
                                                    <div className="glass-card p-3 rounded-xl border border-slate-800/50">
                                                        <label className="text-[9px] font-bold text-slate-500 uppercase">Wilaya & Commune DHD</label>
                                                        <select value={order.wilaya} onChange={e=>{ const wd=DHD_WILAYAS.find(w=>w.name===e.target.value); updateOrder(order.id, {wilaya: wd.name, wilaya_id: wd.id, commune: wd.communes[0]}); }} className="w-full bg-transparent text-xs font-bold text-white outline-none mt-1">
                                                            {DHD_WILAYAS.map(w => <option key={w.id} value={w.name} className="bg-slate-900">{w.name}</option>)}
                                                        </select>
                                                        <select value={order.commune||wData.communes[0]} onChange={e=>updateOrder(order.id, {commune: e.target.value})} className="w-full bg-transparent text-xs font-bold text-cyan-400 outline-none mt-1 border-t border-slate-800 pt-1">
                                                            {wData.communes.map(c => <option key={c} value={c} className="bg-slate-900">{c}</option>)}
                                                        </select>
                                                    </div>
                                                </div>

                                                {/* DELIVERY TYPE */}
                                                <div className="flex gap-2">
                                                    <button onClick={() => updateOrder(order.id, { deliveryType: 'Domicile', shippingFeeDZD: wData.homeFee, totalPriceDZD: (order.quantity*order.unitPriceDZD)+wData.homeFee })} className={`flex-1 py-2 rounded-xl text-xs font-bold border transition ${order.deliveryType==='Domicile'?'bg-emerald-500/20 border-emerald-500/50 text-emerald-400':'bg-slate-800/50 border-slate-700 text-slate-400'}`}>Domicile ({wData.homeFee} DA)</button>
                                                    <button onClick={() => updateOrder(order.id, { deliveryType: 'StopDesk', shippingFeeDZD: wData.stopDeskFee, totalPriceDZD: (order.quantity*order.unitPriceDZD)+wData.stopDeskFee })} className={`flex-1 py-2 rounded-xl text-xs font-bold border transition ${order.deliveryType==='StopDesk'?'bg-emerald-500/20 border-emerald-500/50 text-emerald-400':'bg-slate-800/50 border-slate-700 text-slate-400'}`}>StopDesk ({wData.stopDeskFee} DA)</button>
                                                </div>

                                                {/* REMARQUE */}
                                                <input type="text" placeholder="Remarque ou consigne..." value={order.notes||''} onChange={e=>updateOrder(order.id, {notes: e.target.value})} className="w-full p-3 bg-black/40 border border-slate-700 rounded-xl text-xs text-white focus:border-brandOrange outline-none" />

                                                {/* STATUS BUTTONS */}
                                                <div className="grid grid-cols-4 gap-2">
                                                    <button onClick={()=>updateOrder(order.id, {statusCall: 'Pas_1'})} className="py-2 bg-slate-800 rounded-lg text-[10px] font-bold text-amber-400 border border-slate-700">PAS 1</button>
                                                    <button onClick={()=>updateOrder(order.id, {statusCall: 'Pas_2'})} className="py-2 bg-slate-800 rounded-lg text-[10px] font-bold text-amber-400 border border-slate-700">PAS 2</button>
                                                    <button onClick={()=>updateOrder(order.id, {statusCall: 'Pas_3'})} className="py-2 bg-slate-800 rounded-lg text-[10px] font-bold text-amber-400 border border-slate-700">PAS 3</button>
                                                    <button onClick={()=>updateOrder(order.id, {statusCall: 'Injoignable'})} className="py-2 bg-slate-800 rounded-lg text-[10px] font-bold text-purple-400 border border-slate-700">INJ</button>
                                                </div>

                                                <div className="flex gap-2">
                                                    <button onClick={() => setCancelModalOrder(order)} className="w-1/3 py-3 bg-rose-500/10 text-rose-400 rounded-xl text-xs font-bold border border-rose-500/30">Annuler</button>
                                                    <button onClick={() => updateOrder(order.id, {statusCall: 'Confirme'})} className="w-2/3 py-3 bg-gradient-to-r from-emerald-500 to-teal-500 text-slate-900 rounded-xl text-sm font-black shadow-neon-green">CONFIRMER ✓</button>
                                                </div>

                                                {/* DHD EXPORT BUTTON (Only if Confirmed & Not Exported yet) */}
                                                {order.statusCall === 'Confirme' && !order.trackingCode && (
                                                    <button onClick={() => createDHDOrder(order, (t) => updateOrder(order.id, { trackingCode: t, statusShipping: 'Expedie' }))} className="w-full py-3 bg-cyan-500/20 text-cyan-400 border border-cyan-500/50 rounded-xl text-xs font-black flex items-center justify-center gap-2 hover:bg-cyan-500/30 transition shadow-neon-cyan">
                                                        <i className="fa-solid fa-paper-plane"></i> EXPORT TO DHD EXPRESS API
                                                    </button>
                                                )}
                                                
                                                {/* DHD TRACKING INFO */}
                                                {order.trackingCode && (
                                                    <div className="p-3 bg-cyan-500/10 border border-cyan-500/30 rounded-xl text-center text-xs font-mono text-cyan-400 font-bold">
                                                        DHD TRACKING: {order.trackingCode}
                                                    </div>
                                                )}

                                            </div>
                                        )}
                                    </div>
                                );
                            }) : (
                                <div className="glass-card p-12 text-center rounded-3xl opacity-60">
                                    <i className="fa-solid fa-box-open text-4xl mb-3 text-slate-500"></i>
                                    <p className="text-xs font-bold text-slate-400">Aucune commande trouvée.</p>
                                </div>
                            )}
                        </div>

                    </main>

                    {/* MODAL: CANCEL WARNING */}
                    {cancelModalOrder && (
                        <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                            <div className="bg-[#121624] border border-rose-500/50 p-6 rounded-3xl max-w-sm w-full shadow-2xl fade-in">
                                <h3 className="text-lg font-black text-rose-500 flex items-center gap-2 mb-3"><i className="fa-solid fa-triangle-exclamation"></i> Pénalité d'Annulation</h3>
                                <p className="text-xs text-slate-300 bg-rose-500/10 p-3 rounded-xl border border-rose-500/20 mb-4">L'annulation entraîne une déduction de <strong className="text-rose-400">-10 DA</strong>. {cancelModalOrder.trackingCode && "La commande sera aussi SUPPRIMÉE de DHD Express."}</p>
                                
                                <select value={cancelReason} onChange={e=>setCancelReason(e.target.value)} className="w-full p-3 bg-black/40 border border-slate-700 rounded-xl text-xs text-white outline-none focus:border-rose-500 mb-4">
                                    <option value="">-- Raison --</option>
                                    <option value="Prix élevé">Prix élevé</option>
                                    <option value="Délai">Délai long</option>
                                    <option value="Faux numéro">Faux numéro / Erreur</option>
                                </select>

                                <div className="flex gap-2">
                                    <button onClick={()=>setCancelModalOrder(null)} className="flex-1 py-3 bg-slate-800 text-white rounded-xl text-xs font-bold">Retour</button>
                                    <button disabled={!cancelReason} onClick={() => updateOrder(cancelModalOrder.id, {statusCall: 'Annule', cancelReason: cancelReason})} className="flex-1 py-3 bg-rose-600 disabled:opacity-50 text-white rounded-xl text-xs font-black">Annuler (-10 DA)</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
